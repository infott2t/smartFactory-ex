<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정산 결제 로그 | 스마트팩토리</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <script src="./js/auth.js" type="text/javascript"></script>
    <script src="./js/auth-guard.js" type="text/javascript"></script>
    <script src="./js/store.js" type="text/javascript"></script>

    <style>
        :root {
            --bg-base: #070320;
            --bg-card: #272727;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-primary: #6366f1;
            --accent-secondary: rgb(253, 132, 237);
            --accent-pink: #fd79a8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-money: #10b981;
            --border-light: rgba(255, 255, 255, 0.08);
            font-family: 'Pretendard', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: min(720px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 0 0 60px;
        }

        /* ── Header ── */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(7, 3, 32, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: var(--bg-card-hover);
        }

        .app-header h1 {
            font-size: 17px;
            font-weight: 700;
        }

        /* ── Balance Summary ── */
        .balance-card {
            position: relative;
            overflow: hidden;
            margin: 16px;
            padding: 22px 20px;
            border-radius: 18px;
            background: var(--accent-gradient);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.28);
        }

        .balance-card::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -40px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .balance-label {
            position: relative;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
        }

        .balance-amount {
            position: relative;
            margin-top: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .balance-meta {
            position: relative;
            margin-top: 10px;
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.82);
        }

        /* ── Section ── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 26px 16px 12px;
        }

        .section-header h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .section-header h2 i {
            color: var(--accent-secondary);
        }

        .section-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
        }

        /* ── Timeline ── */
        .log-timeline {
            padding: 0 16px;
        }

        .log-date-group {
            margin-bottom: 22px;
        }

        .log-date-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .log-date-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .log-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-card {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 14px;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            background: var(--bg-card);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .log-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-1px);
        }

        .log-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 19px;
            background: rgba(253, 121, 168, 0.14);
            color: var(--accent-pink);
        }

        .log-icon.income {
            background: rgba(16, 185, 129, 0.14);
            color: var(--accent-money);
        }

        .log-body {
            min-width: 0;
        }

        .log-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
            word-break: keep-all;
        }

        .log-sub {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.45;
            word-break: keep-all;
        }

        .log-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 7px;
        }

        .log-chip {
            padding: 2px 8px;
            border: 1px solid var(--border-light);
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .log-chip.brand {
            border-color: rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
        }

        .log-right {
            text-align: right;
            flex-shrink: 0;
        }

        .log-amount {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-pink);
            white-space: nowrap;
        }

        .log-amount.income {
            color: var(--accent-money);
        }

        .log-time {
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-sub);
        }

        .log-balance {
            margin-top: 3px;
            font-size: 10px;
            color: var(--text-sub);
            white-space: nowrap;
        }

        /* ── Empty ── */
        .empty-state {
            margin: 30px 16px;
            padding: 44px 20px;
            text-align: center;
            border: 1px dashed var(--border-light);
            border-radius: 16px;
            background: var(--bg-card);
        }

        .empty-state i {
            font-size: 38px;
            color: var(--text-sub);
            opacity: 0.6;
        }

        .empty-state p {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .empty-state span {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09031f">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="/js/pwa.js" defer></script>
</head>

<body>
    <main class="page">
        <header class="app-header">
            <button class="back-btn" type="button" id="back-button" aria-label="뒤로가기">‹</button>
            <h1>정산 결제 로그</h1>
        </header>

        <section class="balance-card">
            <div class="balance-label">현재 정산 자산</div>
            <div class="balance-amount">₩ <span id="current-balance">0</span></div>
            <div class="balance-meta">
                <span id="total-spent-meta">총 차감 ₩0</span>
                <span id="log-count-meta">결제 0건</span>
            </div>
        </section>

        <div class="section-header">
            <h2><i class="bi bi-receipt"></i> 내역 상세</h2>
            <span class="section-count" id="log-section-count">최신순</span>
        </div>

        <section class="log-timeline" id="log-timeline"></section>
    </main>

    <script>
        const currency = new Intl.NumberFormat('ko-KR');
        let currentUser = null;

        document.getElementById('back-button').addEventListener('click', () => {
            if (history.length > 1) history.back();
            else location.href = './mypage2.html';
        });

        function resolveCurrentUser() {
            let user = window.AuthManager && typeof window.AuthManager.getCurrentUser === 'function'
                ? window.AuthManager.getCurrentUser()
                : null;
            if (!user) {
                try {
                    const raw = sessionStorage.getItem('user');
                    if (raw) user = JSON.parse(raw);
                } catch (e) {}
            }
            return user;
        }

        function getUserKey() {
            if (!currentUser) return sessionStorage.getItem('user-id') || '2';
            return currentUser.id || currentUser.email || currentUser.name;
        }

        function formatDateLabel(isoString) {
            const date = new Date(isoString);
            if (!Number.isFinite(date.getTime())) return '날짜 미상';

            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
                && a.getMonth() === b.getMonth()
                && a.getDate() === b.getDate();

            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const base = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')} (${weekdays[date.getDay()]})`;

            if (sameDay(date, today)) return `오늘 · ${base}`;
            if (sameDay(date, yesterday)) return `어제 · ${base}`;
            return base;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            if (!Number.isFinite(date.getTime())) return '-';
            return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function getDateKey(isoString) {
            const date = new Date(isoString);
            if (!Number.isFinite(date.getTime())) return 'unknown';
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getLogIcon(log) {
            const workId = String(log.workId || '');
            if (workId === '6') return 'bi-fire';
            if (workId === '2') return 'bi-cup-hot-fill';
            if (workId === '1') return 'bi-basket2-fill';
            if (workId === '3') return 'bi-wallet2';
            if (workId === '7') return 'bi-shop';
            return 'bi-bag-check-fill';
        }

        function buildItemsSummary(log) {
            if (!Array.isArray(log.items) || log.items.length === 0) return '';
            return log.items
                .map(item => `${item.name} ${item.quantity || 1}${item.unit || '개'}`)
                .join(' · ');
        }

        function renderLogs() {
            const userKey = getUserKey();
            const logs = (window.MockData && typeof window.MockData.getSettlementLogs === 'function')
                ? window.MockData.getSettlementLogs(userKey)
                : [];
            const balance = (window.MockData && typeof window.MockData.getUserSettlementBalance === 'function')
                ? window.MockData.getUserSettlementBalance(userKey)
                : 100000;

            document.getElementById('current-balance').textContent = currency.format(balance);

            // 수입(근로 급여, amount > 0)과 차감(구매, amount < 0)을 분리해 표기한다.
            const totalSpent = logs.reduce((sum, log) => {
                const amount = Number(log.amount) || 0;
                return amount < 0 ? sum + Math.abs(amount) : sum;
            }, 0);
            const totalEarned = logs.reduce((sum, log) => {
                const amount = Number(log.amount) || 0;
                return amount > 0 ? sum + amount : sum;
            }, 0);
            document.getElementById('total-spent-meta').textContent = totalEarned > 0
                ? `수입 ₩${currency.format(totalEarned)} · 차감 ₩${currency.format(totalSpent)}`
                : `총 차감 ₩${currency.format(totalSpent)}`;
            document.getElementById('log-count-meta').textContent = `내역 ${logs.length}건`;
            document.getElementById('log-section-count').textContent = logs.length > 0 ? `${logs.length}건 · 최신순` : '최신순';

            const container = document.getElementById('log-timeline');

            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-receipt-cutoff"></i>
                        <p>정산금액 결제 내역이 없습니다.</p>
                        <span>매장 주문이나 상품 구입 시 정산 자산에서<br>차감된 기록이 여기에 시간순으로 표시됩니다.</span>
                    </div>`;
                return;
            }

            // 날짜별 그룹화 (이미 최신순으로 정렬되어 들어옴)
            const groups = [];
            const groupMap = new Map();
            logs.forEach(log => {
                const key = getDateKey(log.createdAt);
                if (!groupMap.has(key)) {
                    const group = { key, label: formatDateLabel(log.createdAt), items: [] };
                    groupMap.set(key, group);
                    groups.push(group);
                }
                groupMap.get(key).items.push(log);
            });

            container.innerHTML = groups.map(group => `
                <div class="log-date-group">
                    <div class="log-date-label">${escapeHtml(group.label)}</div>
                    <div class="log-list">
                        ${group.items.map(log => {
                            const amount = Number(log.amount) || 0;
                            const isIncome = amount > 0;
                            const itemsSummary = buildItemsSummary(log);
                            const chips = [];
                            if (log.storeName) chips.push(`<span class="log-chip brand">${escapeHtml(log.storeName)}</span>`);
                            chips.push(`<span class="log-chip">${escapeHtml(log.category || '상품 구입')}</span>`);
                            if (log.orderNo) chips.push(`<span class="log-chip">${escapeHtml(log.orderNo)}</span>`);

                            return `
                                <article class="log-card">
                                    <div class="log-icon ${isIncome ? 'income' : ''}">
                                        <i class="bi ${isIncome ? 'bi-plus-circle-fill' : getLogIcon(log)}"></i>
                                    </div>
                                    <div class="log-body">
                                        <div class="log-title">${escapeHtml(log.title || '정산금액 차감')}</div>
                                        ${itemsSummary ? `<div class="log-sub">${escapeHtml(itemsSummary)}</div>` : (log.description ? `<div class="log-sub">${escapeHtml(log.description)}</div>` : '')}
                                        <div class="log-chips">${chips.join('')}</div>
                                    </div>
                                    <div class="log-right">
                                        <div class="log-amount ${isIncome ? 'income' : ''}">${isIncome ? '+' : '-'}₩${currency.format(Math.abs(amount))}</div>
                                        <div class="log-time">${escapeHtml(formatTime(log.createdAt))}</div>
                                        ${log.balanceAfter !== null && log.balanceAfter !== undefined
                                            ? `<div class="log-balance">잔액 ₩${currency.format(log.balanceAfter)}</div>`
                                            : ''}
                                    </div>
                                </article>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        currentUser = resolveCurrentUser();
        if (!currentUser) {
            alert('로그인이 필요합니다.');
            location.href = './login.html';
        } else {
            renderLogs();
            window.addEventListener('storage', renderLogs);
        }
    </script>
</body>

</html>
