<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 주문 관리 - Smart Factory</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-main: #0b0c10;
            --card-bg: #161822;
            --card-border: #232738;
            --accent-primary: #7b5cf5;
            --accent-secondary: #00b894;
            --accent-pink: #fd79a8;
            --accent-gold: #fdcb6e;
            --text-main: #ffffff;
            --text-sub: #9499b1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 40px;
        }

        /* 📱 Header - explore2 / mypage2 규격 준수 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* 📦 Main Container & Section Cards */
        .main-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        /* 🎁 Product Summary Card */
        .product-summary-box {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .product-thumb {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--card-border);
            background-color: #000;
        }

        .product-info-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-size: 11px;
            color: var(--accent-primary);
            font-weight: 700;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .product-meta {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-pink);
        }

        /* 🚚 Waybill & Delivery Header */
        .waybill-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .waybill-num {
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .btn-copy-waybill {
            background: rgba(123, 92, 245, 0.15);
            color: var(--accent-primary);
            border: 1px solid rgba(123, 92, 245, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ⏳ Delivery Status Timeline */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            padding-left: 20px;
            margin-top: 10px;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
        }

        .timeline-item {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline-dot {
            position: absolute;
            left: -20px;
            top: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 3px solid var(--text-sub);
            z-index: 2;
        }

        .timeline-item.active .timeline-dot {
            border-color: var(--accent-secondary);
            background: var(--accent-secondary);
            box-shadow: 0 0 10px rgba(0, 184, 148, 0.6);
        }

        .timeline-item.completed .timeline-dot {
            border-color: var(--accent-primary);
            background: var(--accent-primary);
        }

        .timeline-status {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .timeline-item.active .timeline-status {
            color: var(--accent-secondary);
            font-size: 15px;
        }

        .timeline-item.completed .timeline-status {
            color: var(--text-main);
        }

        .timeline-location {
            font-size: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-time {
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09031f">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="./js/pwa.js?v=20260731-pwa-v8" defer></script>
    <script src="./js/auth.js" type="text/javascript"></script>
    <script src="./js/auth-guard.js" type="text/javascript"></script>
</head>
<body>

    <!-- 📱 Header -->
    <header class="app-header">
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <i class="bi bi-chevron-left"></i>
            </button>
            <span class="header-title">배송 주문 관리</span>
        </div>
    </header>

    <main class="main-container">

        <!-- 🎁 1. 상품 정보 요약 카드 -->
        <section class="section-card">
            <div class="section-header">
                <span class="section-title"><i class="bi bi-bag-check-fill" style="color: var(--accent-primary);"></i> 주문 상품 정보</span>
            </div>
            <div class="product-summary-box">
                <img id="delivery-prod-img" src="./images/kimchi_1kg.png" alt="상품 이미지" class="product-thumb">
                <div class="product-info-details">
                    <span class="brand-name" id="delivery-brand-name">AFood</span>
                    <span class="product-title" id="delivery-prod-title">1kg 포기김치 팩</span>
                    <div class="product-meta">
                        <span><span id="delivery-qty">1</span>개 / 무료배송</span>
                        <span class="product-price">₩ <span id="delivery-price">8,000</span></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 🚚 2. 배송 조회 및 실시간 송장/위치 타임라인 -->
        <section class="section-card">
            <div class="section-header">
                <span class="section-title"><i class="bi bi-truck-flatbed" style="color: var(--accent-secondary);"></i> 실시간 배송 조회</span>
            </div>

            <!-- 송장 번호 안내 -->
            <div class="waybill-box">
                <div>
                    <span style="color: var(--text-sub); font-size: 12px;">택배사 / 송장번호</span>
                    <div class="waybill-num" id="waybill-code">출고 후 발급 예정</div>
                </div>
                <button type="button" class="btn-copy-waybill" onclick="copyWaybill()">복사</button>
            </div>

            <!-- 현재 배송 상태 요약 (매니저 콘솔 진행 상태와 연동) -->
            <div id="delivery-status-summary" style="margin: 4px 0 14px; padding: 11px 13px; border-radius: 10px; font-size: 13px; font-weight: 700;"></div>

            <!-- 배송 상태 타임라인 (실제 배송 상태에 따라 렌더링) -->
            <div class="timeline-container" id="delivery-timeline"></div>
        </section>

    </main>

    <!-- 스크립트 모듈 연동 -->
    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/store.js"></script>

    <script>
        $(document).ready(function() {
            loadDeliveryDetailData();
        });

        function loadDeliveryDetailData() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderNo = urlParams.get('orderNo');
            const productId = urlParams.get('productId') || 'p1kg';

            let orderItem = null;

            // FactoryStore 상의 shopHistory 탐색
            if (window.FactoryStore && window.FactoryStore.getState) {
                const shopHistory = window.FactoryStore.getState().shopHistory || [];
                if (orderNo) {
                    orderItem = shopHistory.find(item => item.orderNo === orderNo);
                }
                if (!orderItem && productId) {
                    orderItem = shopHistory.find(item => item.productId === productId || String(item.productId) === String(productId));
                }
            }

            let prodImg = './images/kimchi_1kg.png';
            let brandName = 'AFood';
            let prodTitle = '1kg 포기김치 팩';
            let priceVal = 8000;
            let qtyVal = 1;
            let dateText = '2026.07.23 14:15';

            if (orderItem) {
                prodTitle = orderItem.productName || prodTitle;
                brandName = orderItem.brandName || brandName;
                priceVal = orderItem.price || priceVal;
                qtyVal = orderItem.qty || 1;
                // 주문 시각: createdAt(ISO)이 있으면 실제 시각을 사용한다.
                const createdText = formatDeliveryTime(orderItem.createdAt || orderItem.orderedAt);
                dateText = createdText
                    || ((orderItem.dateStr || orderItem.orderDate || '2026.07.23') + ' ' + (orderItem.orderTime || '14:15'));

                const pIdStr = String(orderItem.productId || '');
                const products = (window.FactoryStore && typeof window.FactoryStore.getProducts === 'function')
                    ? window.FactoryStore.getProducts()
                    : ((window.MockData && window.MockData.storeProducts) || []);
                if (products.length) {
                    const found = products.find(p => p.productCode === pIdStr || String(p.productId) === pIdStr || p.name === prodTitle);
                    if (found) {
                        prodImg = found.img || prodImg;
                        brandName = found.brand || brandName;
                    }
                }
            } else {
                // Fallback catalog
                const products = (window.FactoryStore && typeof window.FactoryStore.getProducts === 'function')
                    ? window.FactoryStore.getProducts()
                    : ((window.MockData && window.MockData.storeProducts) || []);
                if (products.length) {
                    const found = products.find(p => p.productCode === productId || String(p.productId) === productId);
                    if (found) {
                        prodTitle = found.name;
                        brandName = found.brand;
                        prodImg = found.img;
                        priceVal = found.price;
                    }
                }
            }

            $('#delivery-prod-img').attr('src', prodImg);
            $('#delivery-brand-name').text(brandName);
            $('#delivery-prod-title').text(prodTitle);
            $('#delivery-qty').text(qtyVal);
            $('#delivery-price').text(priceVal.toLocaleString());

            renderDeliveryTimeline(orderItem, dateText);
        }

        /* 실제 배송 상태(deliveryStatus)에 맞춰 타임라인을 그린다.
           매니저 콘솔(manager.html)의 진행 상태 변경이 store.js 를 통해
           주문의 deliveryStatus / deliveryHistory 에 반영된다. */
        const DELIVERY_STEPS = [
            { code: 'ordered', label: '구매 완료 (결제 완료)', icon: 'bi-building', place: 'AFood 스마트팩토리 1센터' },
            { code: 'preparing', label: '상품 생산 중', icon: 'bi-gear-wide-connected', place: 'AFood 스마트팩토리 김치 생산라인' },
            { code: 'packed', label: '포장 완료', icon: 'bi-box-seam', place: 'AFood 스마트팩토리 포장실' },
            { code: 'ready_to_ship', label: '출하 준비 완료', icon: 'bi-box-arrow-up-right', place: '서울 서대문 물류센터' },
            { code: 'shipping', label: '🚚 배송 중', icon: 'bi-geo-alt-fill', place: '마포 배달 캠프 (담당 기사 김철수 010-8888-9999)' },
            { code: 'delivered', label: '배송 완료', icon: 'bi-house-door-fill', place: '고객 주소지' }
        ];

        function normalizeDeliveryCode(code) {
            const value = String(code || 'ordered');
            if (['received', 'completed', 'done'].includes(value)) return 'delivered';
            if (['in_transit', 'shipped', 'out_for_delivery'].includes(value)) return 'shipping';
            return DELIVERY_STEPS.some(step => step.code === value) ? value : 'ordered';
        }

        function formatDeliveryTime(value) {
            const date = new Date(value);
            if (!Number.isFinite(date.getTime())) return '';
            const pad = n => String(n).padStart(2, '0');
            return date.getFullYear() + '.' + pad(date.getMonth() + 1) + '.' + pad(date.getDate())
                + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function renderDeliveryTimeline(orderItem, orderedAtText) {
            const currentCode = normalizeDeliveryCode(orderItem && (orderItem.deliveryStatus || orderItem.shippingStatus));
            const currentIndex = DELIVERY_STEPS.findIndex(step => step.code === currentCode);
            const history = (orderItem && Array.isArray(orderItem.deliveryHistory)) ? orderItem.deliveryHistory : [];
            const timeOf = code => {
                const hit = history.filter(h => h && normalizeDeliveryCode(h.code) === code)[0];
                return hit ? formatDeliveryTime(hit.at) : '';
            };

            const html = DELIVERY_STEPS.map((step, index) => {
                const state = index < currentIndex ? 'completed' : (index === currentIndex ? 'active' : '');
                let timeText = step.code === 'ordered' ? (timeOf('ordered') || orderedAtText || '') : timeOf(step.code);
                if (!timeText) {
                    timeText = index <= currentIndex ? '진행 완료' : '진행 예정';
                }
                return `
                <div class="timeline-item ${state}">
                    <div class="timeline-dot"></div>
                    <div class="timeline-status">${step.label}${index === currentIndex ? ' · 현재 단계' : ''}</div>
                    <div class="timeline-location"><i class="bi ${step.icon}"></i> ${step.place}</div>
                    <div class="timeline-time">${timeText}</div>
                </div>`;
            }).join('');
            $('#delivery-timeline').html(html);

            // 상태 요약 배너
            const summary = $('#delivery-status-summary');
            const label = (orderItem && orderItem.deliveryStatusLabel) || DELIVERY_STEPS[Math.max(0, currentIndex)].label;
            let tone = { bg: 'rgba(245, 158, 11, 0.12)', border: '#fbbf24', color: '#fbbf24', text: '배송 준비중' };
            if (currentCode === 'shipping') {
                tone = { bg: 'rgba(59, 130, 246, 0.12)', border: '#93c5fd', color: '#93c5fd', text: '배송중' };
            } else if (currentCode === 'delivered') {
                tone = { bg: 'rgba(16, 185, 129, 0.12)', border: '#34d399', color: '#34d399', text: '배송 완료' };
            }
            summary
                .css({ background: tone.bg, border: '1px solid ' + tone.border, color: tone.color })
                .html(`<i class="bi bi-truck"></i> 현재 상태: ${tone.text}`
                    + (label && label !== tone.text ? ` <span style="opacity:.8; font-weight:600;">(${label})</span>` : ''));

            // 송장번호는 출하(배송 시작) 이후에만 발급된다.
            const shippedIndex = DELIVERY_STEPS.findIndex(step => step.code === 'shipping');
            if (currentIndex >= shippedIndex) {
                const seed = String((orderItem && (orderItem.orderNo || orderItem.id)) || '0').replace(/\D/g, '') || '0';
                const padded = (seed + '000000000000').slice(0, 12);
                $('#waybill-code').text('대한통운 ' + padded.slice(0, 4) + '-' + padded.slice(4, 8) + '-' + padded.slice(8, 12));
            } else {
                $('#waybill-code').text('출고 후 발급 예정');
            }
        }

        function copyWaybill() {
            const code = $('#waybill-code').text();
            if (code.indexOf('발급 예정') >= 0) {
                alert('아직 송장번호가 발급되지 않았습니다.\n상품이 출고되어 배송이 시작되면 발급됩니다.');
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                alert('송장번호가 클립보드에 복사되었습니다: ' + code);
            }).catch(() => {
                alert('송장번호: ' + code);
            });
        }
    </script>
</body>
</html>
