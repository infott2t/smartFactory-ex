<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>알림 | 스마트팩토리</title>
    <link rel="stylesheet" href="./css/mypage.css?v=1.0.2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/app-notifications.css?v=1.0.1">
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* 헤더 타이틀 중앙 정렬 (explore_detail.html 과 동일 규칙) */
        .header-wrap .header {
            position: relative;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            max-width: 800px;
            margin: 0 auto;
            padding-top: 16px;
            padding-bottom: 0;
        }

        .header-wrap .title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin-right: 0 !important;
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
            white-space: nowrap;
            text-align: center;
        }

        /* 알림 페이지에서는 헤더의 종 버튼을 숨깁니다 (같은 화면이므로 중복) */
        .app-header-actions {
            display: none !important;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        .notification-page-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 4px 12px 4px;
        }

        .notification-page-count {
            color: var(--notification-accent);
            font-size: 13px;
            font-weight: 700;
        }

        .notification-page-list {
            overflow: hidden;
            border: 1px solid var(--notification-border);
            border-radius: 16px;
            background: var(--notification-surface);
        }

        .notification-page-list .app-notification-item:last-child {
            border-bottom: 0;
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09031f">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="/js/pwa.js" defer></script>
</head>

<body>
    <div class="header-wrap">
        <div class="header menu-bar mypage">
            <div class="chevron" id="btn-back" style="cursor: pointer;">
                <i class="bi bi-chevron-left back"></i>
            </div>
            <div class="title"><span>알림</span></div>
        </div>
    </div>

    <div class="container">
        <div class="notification-page-toolbar">
            <span id="notification-count" class="notification-page-count">모두 확인함</span>
            <button type="button" id="notification-mark-all" class="app-notification-mark-all">모두 읽음</button>
        </div>
        <div id="notification-list" class="app-notification-list notification-page-list"></div>
    </div>

    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/auth.js" type="text/javascript"></script>
    <script src="./js/auth-guard.js" type="text/javascript"></script>
    <script src="./js/store.js" type="text/javascript"></script>
    <script src="./js/app-notifications.js?v=1.0.1"></script>
    <script>
        (function () {
            "use strict";

            // 알림 타입별 아이콘은 app-notifications.js 가 노출한 테이블/함수를 재사용한다.
            function getTypeIcon(type) {
                return (window.AppNotifications && typeof window.AppNotifications.getTypeIcon === 'function')
                    ? window.AppNotifications.getTypeIcon(type)
                    : 'bi-info-circle-fill';
            }

            // 전체 목록 화면이므로 연도까지 표기한다. (드롭다운 패널은 연도를 생략)
            function formatRelativeTime(value) {
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return "";
                const diff = Date.now() - date.getTime();
                if (diff < 60000) return "방금 전";
                if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + "분 전";
                if (diff < 86400000) return Math.floor(diff / 3600000) + "시간 전";
                return new Intl.DateTimeFormat("ko-KR", {
                    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
                }).format(date);
            }

            function createElement(tag, className, text) {
                const element = document.createElement(tag);
                if (className) element.className = className;
                if (text !== undefined) element.textContent = text;
                return element;
            }

            function getItems() {
                return window.AppNotifications && typeof window.AppNotifications.getAll === "function"
                    ? window.AppNotifications.getAll()
                    : [];
            }

            function render() {
                const list = document.getElementById("notification-list");
                const countLabel = document.getElementById("notification-count");
                const markAllButton = document.getElementById("notification-mark-all");
                if (!list) return;

                const items = getItems();
                const unreadCount = items.filter(item => !item.readAt).length;
                countLabel.textContent = unreadCount ? "읽지 않음 " + unreadCount + "개" : "모두 확인함";
                markAllButton.disabled = unreadCount === 0;
                list.textContent = "";

                if (items.length === 0) {
                    const empty = createElement("div", "app-notification-empty");
                    const icon = createElement("i", "bi bi-bell-slash");
                    icon.setAttribute("aria-hidden", "true");
                    empty.appendChild(icon);
                    empty.appendChild(createElement("span", "", "새로운 알림이 없습니다."));
                    list.appendChild(empty);
                    return;
                }

                items.forEach(item => {
                    const button = createElement("button", "app-notification-item" + (!item.readAt ? " is-unread" : ""));
                    button.type = "button";
                    button.dataset.notificationId = item.id;
                    button.setAttribute("aria-label", item.title + (item.readAt ? "" : ", 읽지 않음"));

                    const iconWrap = createElement("span", "app-notification-item__icon");
                    const icon = createElement("i", "bi " + getTypeIcon(item.type));
                    icon.setAttribute("aria-hidden", "true");
                    iconWrap.appendChild(icon);

                    const content = createElement("span", "app-notification-item__content");
                    content.appendChild(createElement("span", "app-notification-item__title", item.title));
                    if (item.message) content.appendChild(createElement("span", "app-notification-item__message", item.message));
                    content.appendChild(createElement("span", "app-notification-item__time", formatRelativeTime(item.createdAt)));

                    button.appendChild(iconWrap);
                    button.appendChild(content);
                    button.addEventListener("click", function () {
                        if (window.AppNotifications) window.AppNotifications.markRead(item.id);
                        if (item.href) window.location.href = item.href;
                        else render();
                    });
                    list.appendChild(button);
                });
            }

            document.getElementById("btn-back").addEventListener("click", function () {
                if (window.history.length > 1) window.history.back();
                else window.location.href = "./explore2.html";
            });

            document.getElementById("notification-mark-all").addEventListener("click", function () {
                if (window.AppNotifications) window.AppNotifications.markAllRead();
                render();
            });

            window.addEventListener("app:notifications-changed", render);
            // app-notifications.js 는 DOMContentLoaded 시점에 저장소를 로드하므로 load 이후 렌더링합니다.
            window.addEventListener("load", render);
        })();
    </script>
</body>

</html>
