        onclick="if(event.target===this)window.closeExploreOfflineQr()">
        <div class="explore-qr-card">
            <div style="font-size:17px;font-weight:800"><i class="bi bi-qr-code-scan" style="color:#fbbf24"></i> 현장결제 QR</div>
            <div id="explore-qr-order-info" style="margin-top:10px;color:var(--text-sub);font-size:12px;line-height:1.7"></div>
            <button type="button" class="explore-qr-demo" id="explore-qr-demo" onclick="window.simulateExploreOfflineQrPayment()">
                <i class="bi bi-qr-code-scan"></i>
                <b>데모: QR코드 찍기</b>
                <span style="font-size:12px;color:var(--text-sub)">클릭하면 현장결제가 완료됩니다.</span>
            </button>
            <div class="explore-qr-status" id="explore-qr-status">QR코드를 찍기 전에는 주문이 접수되지 않습니다.</div>

    <script src="./js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            // URL 파라미터로 초기 탭 설정
            const urlParams = new URLSearchParams(window.location.search);
            const initialTab = urlParams.get('tab') || 'partner';

            let targetIndex = 0;
            if (initialTab === 'reservation') targetIndex = 1;
            if (initialTab === 'history') targetIndex = 2;
            if (initialTab === 'shopping') targetIndex = 3;

            $('.tab-item').removeClass('active');
            $('.tab-item').eq(targetIndex).addClass('active');
            $('.tab-content').removeClass('active').eq(targetIndex).addClass('active');

            // 탭 변경 이벤트
            $(document).on('click', '.tab-list .tab-item', function () {
                let currentIndex = $('.tab-list .tab-item.active').index();
                let newIndex = $(this).index();
                let moveDirection = newIndex > currentIndex ? 'move-next' : 'move-prev';

                $('.tab-item').removeClass('active');
                $(this).addClass('active');

                $('.tab-content').removeClass('active move-next move-prev');
                $('.tab-content').eq(newIndex).addClass('active ' + moveDirection);

                renderCurrentTab(newIndex);
            });

            // 전역 정렬 상태 (처음 접속 시 날짜 내림차순 정렬)
            let currentSortType = 'date'; // 'date', 'pay', or 'like'
            let currentSortDir = 'desc';
            const selectedHistoryById = {};
            const selectedReservationById = {};
            let pendingExploreOfflineQrOrderId = null;
            let exploreQrSubmitting = false;

            window.openExploreHistoryDetail = function(historyId) {
                const key = String(historyId);
                const historyItem = selectedHistoryById[key];
                if (historyItem) {
                    try {
                        sessionStorage.setItem('explore_selected_history', JSON.stringify(historyItem));
                    } catch (e) {}
                }
                window.location.href = `./explore_detail.html?id=${encodeURIComponent(key)}`;
            };

            // 예약 내역 항목 클릭 → 예약 상세(출근하기/취소) 화면으로 이동
            window.openExploreReservationDetail = function(reservationId) {
                const key = String(reservationId);
                const reservation = selectedReservationById[key];
                if (reservation) {
                    try {
                        sessionStorage.setItem('explore_selected_reservation', JSON.stringify(reservation));
                    } catch (e) {}
                }
                window.location.href = `./reservation_detail.html?id=${encodeURIComponent(key)}`;
            };

            // ★ 정렬 토글 기능 (오름차순/내림차순 / 필터)
            $(document).on('click', '.sort-item', function () {
                let $this = $(this);
                const $parentRow = $this.closest('.sort-row');
                $parentRow.find('.sort-item').not(this).removeClass('active sort-up sort-down');

                let selectedType = $this.attr('data-type') || ($this.find('.lspace').text().trim() === '날짜' ? 'date' : 'pay');

                if (currentSortType === selectedType) {
                    if (selectedType !== 'like') {
                        currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
                    }
                } else {
                    currentSortType = selectedType;
                    currentSortDir = 'desc';
                }

                $this.addClass('active');

                if (selectedType !== 'like') {
                    if (currentSortDir === 'asc') {
                        $this.removeClass('sort-down').addClass('sort-up');
                    } else {
                        $this.removeClass('sort-up').addClass('sort-down');
                    }
                }

                const activeIndex = $('.tab-list .tab-item.active').index();
                renderCurrentTab(activeIndex);
            });

            // 데이터 불러오기 유틸리티
            function getCurrentUser() {
                if (window.AuthManager && window.AuthManager.getCurrentUser()) {
                    return window.AuthManager.getCurrentUser();
                }
                let userJson = sessionStorage.getItem("user");
                if (userJson) {
                    try { return JSON.parse(userJson); } catch(e) {}
                }
                return { id: '2', name: '최수아', email: 'capegon21@gmail.com' };
            }

            function getWorkerProfile(userName) {
                let profileStr = sessionStorage.getItem("kimp_worker_profile");
                if (profileStr) return JSON.parse(profileStr);
                return { workedHours: 22 };
            }

            function getCurrentUserShopHistory() {
                const user = getCurrentUser();
                const state = window.FactoryStore ? window.FactoryStore.getState() : { shopHistory: [], utonShopHistory: [] };
                const sources = [];
                if (window.FactoryStore && typeof window.FactoryStore.getShopOrders === 'function') {
                    sources.push(window.FactoryStore.getShopOrders());
                }
                sources.push(state.shopHistory, state.utonShopHistory);
                ['kimp_shop_history', 'uton_shop_history'].forEach(storageKey => {
                    try {
                        const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
                        if (Array.isArray(stored)) sources.push(stored);
                    } catch (e) {}
                });

                const seen = new Set();
                const shopHistory = sources
                    .filter(Array.isArray)
                    .flat()
                    .filter(item => {
                        if (!item) return false;
                        const identity = item.id !== undefined && item.id !== null
                            ? `id:${item.id}`
                            : `order:${item.orderNo || ''}:${item.userId || item.userName || ''}:${item.orderedAt || item.orderDate || ''}`;
                        if (seen.has(identity)) return false;
                        seen.add(identity);
                        return true;
                    });

                const userAliases = new Set();
                [user && user.id, user && user.userId, user && user.email, user && user.name, sessionStorage.getItem('user-id')]
                    .forEach(value => {
                        if (value === undefined || value === null || String(value).trim() === '') return;
                        const normalized = String(value).trim();
                        userAliases.add(normalized);
                        if (normalized.startsWith('local-')) userAliases.add(normalized.slice(6));
                    });

                return shopHistory.filter(item => {
                    if (!item) return false;
                    const hasOrderUserId = item.userId !== undefined &&
                        item.userId !== null &&
                        String(item.userId).trim() !== '';
                    if (!hasOrderUserId) return true;
                    const orderUserId = String(item.userId).trim();
                    if (userAliases.has(orderUserId) || userAliases.has(orderUserId.replace(/^local-/, ''))) return true;
                    return !!(user && user.name && item.userName && String(item.userName) === String(user.name));
                });
            }

            function isUtonMenuOrder(item) {
                const productId = String(item.productId || item.productCode || '').toLowerCase();
                const menuType = String(item.menuType || '').toLowerCase();
                return String(item.workId || '') === '2' ||
                    ['20001', '20002', '200028', 'p1', 'p2'].includes(productId) ||
                    ['udon', 'bibim'].includes(menuType);
            }

            function getWorkProductClass(workId) {
                const wId = String(workId || '');
                const defaults = {
                    '1': { fulfillmentType: 'delivery', thumbnailMode: 'product' },
                    '2': { fulfillmentType: 'dine_in', thumbnailMode: 'product' },
                    '6': { fulfillmentType: 'dine_in', thumbnailMode: 'work_icon' }
                };
                try {
                    const works = JSON.parse((window.MockData && window.MockData.worksJSON) || '[]');
                    const work = works.find(item => String(item.workId) === wId) || {};
                    return Object.assign({}, defaults[wId] || { fulfillmentType: 'delivery', thumbnailMode: 'product' }, work);
                } catch (e) {
                    return defaults[wId] || { fulfillmentType: 'delivery', thumbnailMode: 'product' };
                }
            }

            function resolveShopProductPresentation(item) {
                const workId = String(item.workId || '');
                const productId = String(item.productId || item.productCode || '').toLowerCase();
                const productName = String(item.productName || '');
                const workClass = getWorkProductClass(workId);
                const products = (window.MockData && window.MockData.storeProducts) || [];
                let product = products.find(p =>
                    String(p.productId || '').toLowerCase() === productId ||
                    String(p.productCode || '').toLowerCase() === productId ||
                    String(p.name || '') === productName ||
                    (productId === '200028' && String(p.productCode || '').toLowerCase() === 'p2')
                );
                if (!product && workId) {
                    const workProducts = products.filter(p => String(p.workId || '') === workId && p.isDelivery === false);
                    if (workProducts.length === 1) product = workProducts[0];
                }

                const fulfillmentType = item.fulfillmentType || workClass.fulfillmentType || (product && product.isDelivery ? 'delivery' : 'dine_in');
                const isBibim = ['20002', '200028', 'p2'].includes(productId) || String(item.menuType || '').toLowerCase() === 'bibim' || productName.includes('비빔면') || (productName.includes('간장') && productName.includes('비빔'));
                const isUdon = ['20001', 'p1'].includes(productId) || String(item.menuType || '').toLowerCase() === 'udon' || productName.includes('우동');
                let pImg = './images/33.png';

                if (workClass.thumbnailMode === 'work_icon') {
                    pImg = workClass.iconUrl || pImg;
                } else if (product && product.img) {
                    pImg = product.img;
                } else if (item.img) {
                    pImg = item.img;
                } else if (isBibim) {
                    pImg = './images/somyeon_complete.png';
                } else if (isUdon) {
                    pImg = './images/udon_product.png';
                }

                return {
                    pImg,
                    brandName: (product && product.brand) || item.brandName || workClass.brandName || '상품',
                    isDelivery: fulfillmentType === 'delivery'
                };
            }

            function getShopOrderDateValue(item) {
                const directCandidates = [
                    item && item.orderedAt,
                    item && item.createdAt,
                    item && item.paymentCompletedAt,
                    item && item.updatedAt,
                    item && item.completedAt
                ];
                for (const value of directCandidates) {
                    if (!value) continue;
                    const parsed = new Date(value);
                    if (!Number.isNaN(parsed.getTime())) return parsed;
                }

                const orderDate = String((item && item.orderDate) || '').trim().replace(/\./g, '-');
                const orderTime = String((item && item.orderTime) || '').trim();
                if (orderDate) {
                    const parsed = new Date(`${orderDate}T${orderTime || '00:00:00'}`);
                    if (!Number.isNaN(parsed.getTime())) return parsed;
                }

                const dateStr = String((item && item.dateStr) || '').trim();
                const koreanMatch = dateStr.match(/(?:(\d{4})[.\-/년]\s*)?(\d{1,2})[.\-/월]\s*(\d{1,2})일?(?:\s+(\d{1,2})(?:[:시]\s*)(\d{1,2})?)?/);
                if (koreanMatch) {
                    const now = new Date();
                    const parsed = new Date(
                        Number(koreanMatch[1]) || now.getFullYear(),
                        Number(koreanMatch[2]) - 1,
                        Number(koreanMatch[3]),
                        Number(koreanMatch[4]) || 0,
                        Number(koreanMatch[5]) || 0
                    );
                    if (!Number.isNaN(parsed.getTime())) return parsed;
                }
                return null;
            }

            function formatShopOrderDateTime(item) {
                const parsed = getShopOrderDateValue(item);
                if (parsed) {
                    const yyyy = parsed.getFullYear();
                    const mm = String(parsed.getMonth() + 1).padStart(2, '0');
                    const dd = String(parsed.getDate()).padStart(2, '0');
                    const hh = String(parsed.getHours()).padStart(2, '0');
                    const min = String(parsed.getMinutes()).padStart(2, '0');
                    return `${yyyy}.${mm}.${dd} ${hh}:${min}`;
                }

                const fallbackDate = String((item && (item.dateStr || item.orderDate)) || '주문 날짜 확인 중').trim();
                const fallbackTime = String((item && item.orderTime) || '').trim();
                return [fallbackDate, fallbackTime || '시간 확인 중'].join(' ');
            }

            function clearActiveShopOrderState(target, restoreOrderCount) {
                const activeProduct = sessionStorage.getItem('activeOrderProduct') || localStorage.getItem('activeOrderProduct_local');
                const activeNo = sessionStorage.getItem('activeOrderNo') || localStorage.getItem('activeOrderNo_local');
                const matchesActiveProduct = activeProduct !== null &&
                    target.productId !== undefined &&
                    target.productId !== null &&
                    String(activeProduct) === String(target.productId);
                const matchesActiveOrder = activeNo !== null &&
                    target.orderNo !== undefined &&
                    target.orderNo !== null &&
                    String(activeNo) === String(target.orderNo);

                if (!matchesActiveProduct && !matchesActiveOrder) return;

                try {
                    sessionStorage.removeItem('activeOrderProduct');
                    sessionStorage.removeItem('activeOrderNo');
                    sessionStorage.removeItem('activeOrderQty');
                    localStorage.removeItem('activeOrderProduct_local');
                    localStorage.removeItem('activeOrderNo_local');
                    localStorage.removeItem('activeOrderQty_local');
                    localStorage.removeItem('activeOrderNo_current');

                    if (!restoreOrderCount || !isUtonMenuOrder(target)) return;

                    const qty = Math.max(1, Number.parseInt(target.qty, 10) || 1);
                    let orderCount10Min = parseInt(sessionStorage.getItem('orderCount10Min') || '0', 10);
                    orderCount10Min = Math.max(0, orderCount10Min - qty);
                    sessionStorage.setItem('orderCount10Min', String(orderCount10Min));
                    if (orderCount10Min < 2) sessionStorage.removeItem('orderLimitExpireTime');

                    const productId = String(target.productId || target.productCode || '').toLowerCase();
                    const menuType = String(target.menuType || '').toLowerCase();
                    const isBibim = productId === '20002' || productId === 'p2' || menuType === 'bibim';
                    const counterKey = isBibim ? 'bibimOrderCount' : 'udonOrderCount';
                    let menuCount = parseInt(sessionStorage.getItem(counterKey) || '0', 10);
                    menuCount = Math.max(0, menuCount - qty);
                    sessionStorage.setItem(counterKey, String(menuCount));
                } catch (e) {}
            }

            window.cancelShopOrder = function(id) {
                if (!confirm("정말로 주문을 취소하시겠습니까?")) return;

                const target = getCurrentUserShopHistory().find(item => String(item.id) === String(id));
                if (!target || target.status !== 'pending') return;

                if (window.FactoryStore) {
                    window.FactoryStore.dispatch({ type: 'CANCEL_SHOP_ORDER', payload: target.id });
                }

                clearActiveShopOrderState(target, true);
                renderCurrentTab(3);
                alert("주문이 성공적으로 취소되었습니다.");
            };

            window.completeShopOrder = function(id) {
                const target = getCurrentUserShopHistory().find(item => String(item.id) === String(id));
                if (!target) return;

                const kitchenStatus = target.kitchenStatus || 'queued';
                if (target.status !== 'pending' || kitchenStatus !== 'ready') return;

                if (window.FactoryStore) {
                    window.FactoryStore.dispatch({ type: 'COMPLETE_SHOP_ORDER', payload: target.id });
                }

                clearActiveShopOrderState(target, false);
                renderCurrentTab(3);
                alert(`주문번호 #${target.orderNo || '-'} 수령 완료\n음식을 정상적으로 수령하였습니다. 맛있게 드세요!`);
            };

            window.openExploreOfflineQr = function(id) {
                const target = getCurrentUserShopHistory().find(item => String(item.id) === String(id));
                if (!target || target.paymentMethod !== 'offline' || target.paymentStatus !== 'offline_waiting') {
                    alert('현장결제 대기 주문을 찾을 수 없습니다.');
                    renderCurrentTab(3);
                    return;
                }
                pendingExploreOfflineQrOrderId = String(id);
                exploreQrSubmitting = false;
                $('#explore-qr-order-info').html(
                    `<b style="color:var(--text-main)">${target.productName || '주문 상품'}</b><br>`

            function formatReservationSlotTime(reservation) {
                const fallbackSlotLabels = (window.MockData && typeof window.MockData.getDefaultSlotLabels === 'function' ? window.MockData.getDefaultSlotLabels() : ['10:00 ~ 12:00', '13:00 ~ 15:00', '15:00 ~ 17:00']);
                const fallback = reservation.time || reservation.slotLabel || fallbackSlotLabels[Number(reservation.slot)] || '지정 시간';
                if (window.MockData && typeof window.MockData.formatWorkSlotTime === 'function') {
                    return window.MockData.formatWorkSlotTime(reservation.workId || 1, reservation.slot, fallback);
                }
                return fallback;
            }

            function normalizeReservationDate(reservation) {
                const source = reservation || {};
                const rawDate = source.date ?? source.reservationDate ?? source.reservedDate
                    ?? source.workDate ?? source.scheduleDate ?? source.selectedDate;
                let year;
                let month;
                let day;

                if (rawDate instanceof Date && !Number.isNaN(rawDate.getTime())) {
                    year = rawDate.getFullYear();
                    month = rawDate.getMonth() + 1;
                    day = rawDate.getDate();
                } else if (rawDate && typeof rawDate === 'object') {
                    year = Number(rawDate.year ?? rawDate.y);
                    month = Number(rawDate.month ?? rawDate.m);
                    day = Number(rawDate.day ?? rawDate.date ?? rawDate.d);
                } else if (typeof rawDate === 'number' && Number.isFinite(rawDate)) {
                    const parsedTimestamp = new Date(rawDate);
                    if (!Number.isNaN(parsedTimestamp.getTime())) {
                        year = parsedTimestamp.getFullYear();
                        month = parsedTimestamp.getMonth() + 1;
                        day = parsedTimestamp.getDate();
                    }
                } else if (rawDate !== undefined && rawDate !== null) {
                    const dateText = String(rawDate).trim();
                    let match = dateText.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
                    if (!match) match = dateText.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
                    if (!match) match = dateText.match(/^(\d{4})(\d{2})(\d{2})$/);
                    if (match) {
                        year = Number(match[1]);
                        month = Number(match[2]);
                        day = Number(match[3]);
                    } else {
                        const parsedText = new Date(dateText);
                        if (!Number.isNaN(parsedText.getTime())) {
                            year = parsedText.getFullYear();
                            month = parsedText.getMonth() + 1;
                            day = parsedText.getDate();
                        }
                    }
                }

                const parsedDate = new Date(year, Number(month) - 1, day);
                const isValid = Number.isInteger(year) && Number.isInteger(month) && Number.isInteger(day)
                    && year >= 1900 && year <= 2200
                    && parsedDate.getFullYear() === year
                    && parsedDate.getMonth() === month - 1
                    && parsedDate.getDate() === day;
                if (!isValid) {
                    return { valid: false, key: '', display: '날짜 미정', dayName: '', sortValue: null };
                }

                const monthText = String(month).padStart(2, '0');
                const dayText = String(day).padStart(2, '0');
                const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
                return {
                    valid: true,
                    key: `${year}-${monthText}-${dayText}`,
                    display: `${year}.${monthText}.${dayText}`,
                    dayName: dayNames[parsedDate.getDay()],
                    sortValue: parsedDate.getTime()
                };
            }

            function compareReservationDates(a, b, direction) {
                const dateA = normalizeReservationDate(a);
                const dateB = normalizeReservationDate(b);
                if (dateA.valid !== dateB.valid) return dateA.valid ? -1 : 1;
                if (!dateA.valid && !dateB.valid) return 0;

                let comparison = dateA.sortValue - dateB.sortValue;
                if (comparison === 0) {
                    comparison = (Number(a.slot) || 0) - (Number(b.slot) || 0);
                }
                return direction === 'asc' ? comparison : -comparison;
            }

                } else if (index === 2) {
                    function normalizeHistoryItem(item, itemIndex, userObj) {

                        const normalized = {

                        }

                        return [normalizeHistoryItem({ date: '', job: '김치만들기', role: '일반', pay: 40000 }, 0, userObj)];

                    function parseDate(dateStr) {

                            const cleaned = dateStr.replace(/년|월|일/g, '').trim().split(/\s+/);

                            }
                        }
                        const parts = dateStr.replace(/\./g, '-').split('-');
                        if (parts.length === 3) {
                            return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                        }
                        return new Date(dateStr);
                    }

                    function formatDisplayDate(dateStr) {

                        if (dateStr.includes('년') && dateStr.includes('월')) {
                            return dateStr.replace(/^\d+년\s*/, '');
                        }
                        const parts = dateStr.replace(/\./g, '-').split('-');
                        if (parts.length === 3) {
                            const month = parseInt(parts[1], 10);
                            const day = parseInt(parts[2], 10);
                            return `${month}월 ${day}일`;
                        }
                        return dateStr;
                    }

                    // 역할 라벨 변환은 store.js 의 roleLabelMap / formatRoleLabel 을 사용한다.

                                    <span style="font-size: 11px; color: #a29bfe;">${displayTime}</span>
                                </div>
                                <div class="task-info-col" style="flex: 1.5; text-align: right; align-items: flex-end; display: flex; flex-direction: column;">
                                    <span class="date-text">${formatDisplayDate(h.date)}</span>
                                    <span class="pay-text">+₩ ${payInfo.pay.toLocaleString()}</span>  
                                </div>
                            </div>
                        </div>`;
                    });

                    $('#history-container').html(html);
                } else if (index === 3) {
                    if (window.FactoryStore) {
                        window.FactoryStore.dispatch({ type: 'SYNC_FROM_STORAGE' });
                    }
                    const state = window.FactoryStore ? window.FactoryStore.getState() : { shopHistory: [], isLike: [] };
                    const container = $('#shopping-container');
                    container.empty();

                    // 정렬바 시각적 활성화 상태 동기화
                    const $sortRow = $('#tab-shopping .sort-row');
                    $sortRow.find('.sort-item').removeClass('active sort-up sort-down');
                    if (currentSortType === 'like') {
                        $sortRow.find('[data-type="like"]').addClass('active');
                    } else {
                        const $dateBtn = $sortRow.find('[data-type="date"]');
                        $dateBtn.addClass('active');
                        if (currentSortDir === 'asc') {
                            $dateBtn.addClass('sort-up');
                        } else {
                            $dateBtn.addClass('sort-down');
                        }
                    }

                    if (currentSortType === 'like') {
                        // 좋아요(관심상품) 필터 모드인 경우
                        const currentUserId = String(user.id);
                        const isLikeArr = state.isLike || [];
                        
                        // 현재 사용자의 관심 상품 레코드 필터링
                        const userLikes = isLikeArr.filter(r => String(r.userId) === String(currentUserId));

                        if (userLikes.length === 0) {
                            container.html(`
                                <div class="empty-state" style="padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 14px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                                    <i class="bi bi-heart" style="font-size: 40px; margin-bottom: 6px; color: var(--text-sub); opacity: 0.7;"></i>
                                    <div style="font-weight: bold;">관심 상품으로 등록된 상품이 없습니다</div>
                                </div>
                            `);
                            return;
                        }

                        const storeProducts = (window.MockData && window.MockData.storeProducts) || [];

                        let html = '';
                        userLikes.forEach(record => {
                            const pId = Number(record.productId);
                            const product = storeProducts.find(p => Number(p.productId) === pId) || { name: "상품 " + pId, price: 3000, img: "./images/udon_product.png", brand: "Uton", workId: 2 };
                            
                            html += `
                            <div class="task-item" onclick="location.href='./kimp_detail.html?productId=${product.productId}&workId=${product.workId}'" style="margin-bottom: 12px; cursor: pointer; padding: 14px; background: rgba(0, 0, 0, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <img src="${product.img}" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover;" alt="product">
                                    <div style="text-align: left;">
                                        <div style="font-size: 11px; color: var(--text-sub);">${product.brand || 'Uton'}</div>
                                        <div style="font-size: 13px; font-weight: bold; color: var(--text-main);">${product.name}</div>
                                        <div style="font-size: 10px; color: #a29bfe; margin-top: 2px;">❤ 등록일: ${record.likedAt}</div>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <span style="font-size: 13px; font-weight: bold; color: var(--text-main);">₩ ${product.price.toLocaleString()}</span>
                                    <span style="color: #ff3366; font-size: 18px;"><i class="bi bi-heart-fill"></i></span>
                                </div>
                            </div>`;
                        });
                        container.html(html);
                    } else {
                        // 날짜별 주문이력 모드인 경우
                        const shopHistory = getCurrentUserShopHistory();

                        if (shopHistory.length === 0) {
                            container.html(`
                                <div class="empty-state" style="padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 14px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                                    <i class="bi bi-bag-x" style="font-size: 40px; margin-bottom: 6px; color: var(--text-sub); opacity: 0.7;"></i>
                                    <div style="font-weight: bold;">아직 주문한 내역이 없습니다</div>
                                </div>
                            `);
                            return;
                        }

                        // 날짜 오름차순/내림차순 정렬 적용
                        function parseShopDate(item) {
                            return getShopOrderDateValue(item) || new Date(0);
                        }

                        let sortedHistory = [...shopHistory];
                        sortedHistory.sort((a, b) => {
                            const dateA = parseShopDate(a);
                            const dateB = parseShopDate(b);
                            return currentSortDir === 'asc' ? dateA - dateB : dateB - dateA;
                        });

                        let html = '';
                        sortedHistory.forEach(item => {
                            let statusTextHtml = "";
                            let btnHtml = "";
                            let inlineCancelButtonHtml = "";
                            let inlineReceiveButtonHtml = "";
                            let statusBadgeHtml = "";
                            const allowedKitchenStatuses = ['payment_waiting', 'queued', 'preparing', 'ready'];
                            const kitchenStatus = allowedKitchenStatuses.includes(item.kitchenStatus)
                                ? item.kitchenStatus
                                : 'queued';
                            const isOfflinePaymentWaiting = item.paymentMethod === 'offline'
                                && item.paymentStatus === 'offline_waiting';
                            const parseOrderMoney = value => {
                                if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
                                const parsed = Number(String(value || '').replace(/[^0-9.-]/g, ''));
                                return Number.isFinite(parsed) ? parsed : 0;
                            };
                            const quantity = Math.max(1, Number(item.qty) || 1);
                            const unitPrice = parseOrderMoney(item.unitPrice);
                            const storedPrice = parseOrderMoney(item.price);
                            const orderPrice = Math.max(0, storedPrice || (unitPrice * quantity));
                            const amountHtml = item.shouldShowSpendAmount === false
                                ? `<div style="font-size: 13px; font-weight: 800; color: var(--text-sub); white-space: nowrap;">${item.paymentDisplayLabel || '주문취소됨'}</div>`
                                : `<div style="font-size: 15px; font-weight: 800; color: #ffffff; white-space: nowrap;">-₩ ${orderPrice.toLocaleString()}</div>`;

                            if (item.status === 'pending') {
                                statusTextHtml = `<div style="color: var(--text-main); font-weight: bold; font-size: 14px;">₩ ${orderPrice.toLocaleString()}</div>`;
                                if (isOfflinePaymentWaiting || kitchenStatus === 'payment_waiting') {
                                    statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">현장 결제중</span>`;
                                    inlineReceiveButtonHtml = `
                                        <button type="button" class="res-check-in-btn" style="background:#fbbf24;color:#271b02;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:12px;font-size:11px;font-weight:800;cursor:pointer;" onclick="event.stopPropagation(); window.openExploreOfflineQr('${item.id}')"><i class="bi bi-qr-code-scan"></i> QR 찍고 현장결제</button>`;
                                    inlineCancelButtonHtml = `
                                        <button type="button" class="res-cancel-btn" style="background:rgb(62 62 192);color:#fff;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:12px;font-size:11px;cursor:pointer;" onclick="event.stopPropagation(); window.cancelShopOrder('${item.id}')">주문 취소</button>`;
                                } else if (kitchenStatus === 'ready') {
                                    statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">준비 완료</span>`;
                                    inlineReceiveButtonHtml = `
                                        <button type="button" class="res-check-in-btn" style="background: #10b981; color: #07130f; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer;" onclick="event.stopPropagation(); window.completeShopOrder('${item.id}')">수령하기</button>`;
                                } else {
                                    const isPreparing = kitchenStatus === 'preparing';
                                    statusBadgeHtml = isPreparing
                                        ? `<span style="margin-left: 2px; background: rgba(99, 102, 241, 0.16); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">조리 중</span>`
                                        : `<span style="margin-left: 2px; background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">조리 대기</span>`;
                                    inlineCancelButtonHtml = (String(item.workId || '') === '7' && isPreparing)
                                        ? `<button type="button" class="res-cancel-btn" disabled style="background: rgba(62,62,192,0.4); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.12); padding: 6px 12px; border-radius: 12px; font-size: 11px; cursor: not-allowed;">조리 중 · 취소 불가</button>`
                                        : `
                                        <button type="button" class="res-cancel-btn" style="background: rgb(62 62 192); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 12px; border-radius: 12px; font-size: 11px; cursor: pointer;" onclick="event.stopPropagation(); window.cancelShopOrder('${item.id}')">주문 취소</button>`;
                                }
                            } else if (item.status === 'cancelled') {
                                statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(148, 163, 184, 0.12); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.24); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">주문 취소</span>`;
                                statusTextHtml = `<div style="color: var(--text-sub); font-size: 12px;">주문 취소</div>`;
                            } else if (item.status === 'completed') {
                                // 배달 상품(김치 등)은 결제 완료 후에도 배송 단계를 표시한다.
                                const deliveryState = item.deliveryStatus || item.shippingStatus || null;
                                const isDeliveryOrder = item.fulfillmentType === 'delivery' || !!deliveryState;
                                let completedLabel = '수령 완료';
                                let completedStyle = 'background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.16);';
                                if (isDeliveryOrder) {
                                    if (['delivered', 'received', 'completed'].includes(deliveryState)) {
                                        completedLabel = '배송 완료';
                                        completedStyle = 'background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35);';
                                    } else if (['shipping', 'in_transit', 'shipped'].includes(deliveryState)) {
                                        completedLabel = '배송중';
                                        completedStyle = 'background: rgba(59, 130, 246, 0.14); color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.35);';
                                    } else {
                                        completedLabel = (item.deliveryStatusLabel && item.deliveryStatusLabel !== '주문 완료')
                                            ? item.deliveryStatusLabel : '배송 준비중';
                                        completedStyle = 'background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35);';
                                    }
                                }
                                statusBadgeHtml = `<span style="margin-left: 2px; ${completedStyle} font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">${completedLabel}</span>`;
                                statusTextHtml = `<div style="color: var(--accent-pink); font-weight: bold; font-size: 14px;">-₩ ${orderPrice.toLocaleString()}</div>`;
                                btnHtml = ``;
                            } else {
                                statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(148, 163, 184, 0.12); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.24); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">상태 확인 중</span>`;
                            }

                            // 상품 썸네일 이미지 및 브랜드 탐색
                            let pImg = './images/33.png';
                            let brandName = item.brandName || 'AFood';
                            const pIdStr = String(item.productId || '');
                            const pNameStr = item.productName || '';

                            if (window.MockData && window.MockData.storeProducts) {
                                const found = window.MockData.storeProducts.find(p => p.productCode === pIdStr || String(p.productId) === pIdStr || p.name === pNameStr);
                                if (found) {
                                    pImg = found.img || pImg;
                                    brandName = found.brand || brandName;
                                }
                            }
                            if (!pImg || pImg.includes('undefined')) {
                                if (pNameStr.includes('김치')) pImg = './images/kimchi_300g.png';
                                else if (pNameStr.includes('우동')) pImg = './images/udon_product.png';
                                else if (pNameStr.includes('비빔면')) pImg = './images/somyeon_complete.png';
                                else if (pNameStr.includes('지갑')) pImg = './images/wallet_card.png';
                            }

                            let isDelivery = true;
                            if (window.MockData && window.MockData.storeProducts) {
                                const found = window.MockData.storeProducts.find(p => p.productCode === pIdStr || String(p.productId) === pIdStr || p.name === pNameStr);
                                if (found && found.isDelivery !== undefined) {
                                    isDelivery = found.isDelivery;
                                }
                            }
                            if ((pNameStr.includes("우동") && !pNameStr.includes("수제")) || pNameStr.includes("비빔면")) {
                                isDelivery = false;
                            }

                            const qtyText = (item.qty || 1) + '개';
                            const orderDateTimeText = formatShopOrderDateTime(item);
                            let deliveryBadgeHtml = isDelivery ? `<span style="background: rgba(0, 184, 148, 0.15); color: #00b894; border: 1px solid rgba(0, 184, 148, 0.3); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">배달 상품</span>` : '';
                            const productPresentation = resolveShopProductPresentation(item);
                            pImg = productPresentation.pImg;
                            brandName = productPresentation.brandName;
                            isDelivery = productPresentation.isDelivery;
                            if (!isDelivery) deliveryBadgeHtml = '';

                            let topRightHtml = isDelivery ? 
                                `<div style="font-size: 11px; color: #cfcfcf; font-weight: 600; cursor: pointer;">배송조회 / 상세보기 <i class="bi bi-chevron-right"></i></div>` : 
                                `<div style="font-size: 11px; color: var(--text-sub);">주문번호: ${item.orderNo}번</div>`;

                            let clickAttr = isDelivery ? `onclick="window.location.href='delivery_detail.html?orderNo=${item.orderNo}&productId=${item.productId || ''}'"` : '';
                            let cursorStyle = isDelivery ? 'cursor: pointer;' : '';

                            html += `
                            <div class="task-item" ${clickAttr} style="${cursorStyle} margin-bottom: 12px; display: block; padding: 14px 16px; background: rgba(22, 24, 34, 0.75) !important; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08) !important; min-height: 105px; box-sizing: border-box;">
                                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 12px;">
                                    <div style="display: flex; align-items: center; font-size: 12px; color: var(--text-sub);">
                                        <span>${orderDateTimeText} 주문</span>
                                        ${deliveryBadgeHtml}
                                        ${statusBadgeHtml}
                                    </div>
                                    ${topRightHtml}
                                </div>

                                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <img src="${pImg}" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid var(--card-border);" alt="${pNameStr}">
                                        <div style="text-align: left;">
                                            <div style="font-size: 11px; color: var(--accent-primary); font-weight: bold;">${brandName}</div>
                                            <div style="display: flex; align-items: center; flex-wrap: wrap; font-size: 14px; font-weight: bold; color: var(--text-main); margin-top: 3px;">
                                                <span>${pNameStr} (${qtyText})</span>
                                                <button type="button" class="shop-order-detail-trigger compact" onclick="event.stopPropagation(); openShopOrderDetail('${item.id}', this)"><i class="bi bi-list-ul"></i> 자세히</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                                        ${inlineCancelButtonHtml}
                                        ${inlineReceiveButtonHtml}
                                        ${amountHtml}
                                    </div>
                                </div>
                                ${btnHtml}
                            </div>`;
                        });
                        container.html(html);
                    }
                }
            }

            // 초기 로딩 렌더링
            renderCurrentTab(targetIndex);
        });
    </script>
</body>

</html>
