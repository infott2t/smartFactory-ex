<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/explore.css?v=1.0.2">
    <link rel="stylesheet" href="./css/explore2.css?v=1.0.2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/auth.js" type="text/javascript"></script>
    <script src="./js/store.js" type="text/javascript"></script>
</head>

<body>
    <div class="header-wrap">
        <div class="header menu-bar mypage">
            <div class="chevron" onclick="window.location.href='./mypage2.html';" style="cursor: pointer;">
                <i class="bi bi-chevron-left back"></i>
            </div>
            <div class="title"><span>나의 활동 내역</span></div>
        </div>

        <div class="tabs">
            <ul class="tab-list">
                <li class="tab-item active" data-target="partner">파트너 등급</li>
                <li class="tab-item" data-target="reservation">예약 내역</li>
                <li class="tab-item" data-target="history">근로 이력</li>
                <li class="tab-item" data-target="shopping">나의 쇼핑</li>
            </ul>
        </div>
    </div>

    <div class="main-wrap">
        <main class="main">
            <div class="content-area">

                <section class="tab-content active" id="tab-partner">
                    <div class="sort-row">
                        <div class="sort-item sort-down">
                            <span class="lspace">최근 활동순</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                        <div class="sort-item">
                            <span class="lspace">근로시간순</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                    </div>
                    <div id="partner-container" style="margin-top: 47px;">
                    </div>
                </section>

                <section class="tab-content" id="tab-reservation">
                    <div class="sort-row">
                        <div class="sort-item sort-down" data-type="date">
                            <span class="lspace">날짜</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                        <div class="sort-item" data-type="pay">
                            <span class="lspace">급여</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                    </div>
                    <div id="reservation-container" style="margin-top: 42px;">
                    </div>
                </section>

                <section class="tab-content" id="tab-history">
                    <div class="sort-row">
                        <div class="sort-item sort-down" data-type="date">
                            <span class="lspace">날짜</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                        <div class="sort-item" data-type="pay">
                            <span class="lspace">급여</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                    </div>
                    <div id="history-container" style="margin-top: 42px;">
                    </div>
                </section>

                <section class="tab-content" id="tab-shopping">
                    <div class="sort-row">
                        <div class="sort-item sort-down" data-type="date">
                            <span class="lspace">날짜</span>
                            <div class="sort-arrows">
                                <i class="bi bi-caret-up-fill"></i>
                                <i class="bi bi-caret-down-fill"></i>
                            </div>
                        </div>
                        <div class="sort-item" data-type="like" style="display: inline-flex; align-items: center; gap: 4px; justify-content: center;">
                            <span class="lspace">좋아요</span>
                            <i class="bi bi-heart-fill" style="color: #ff3366; font-size: 12px; vertical-align: middle;"></i>
                        </div>
                    </div>
                    <div id="shopping-container" style="">
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="./js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            // URL 파라미터로 초기 탭 설정
            const urlParams = new URLSearchParams(window.location.search);
            const initialTab = urlParams.get('tab') || 'partner';

            let targetIndex = 0;
            if (initialTab === 'reservation') targetIndex = 1;
            if (initialTab === 'history') targetIndex = 2;
            if (initialTab === 'shopping') targetIndex = 3;

            $('.tab-item').removeClass('active');
            $('.tab-item').eq(targetIndex).addClass('active');
            $('.tab-content').removeClass('active').eq(targetIndex).addClass('active');

            // 탭 변경 이벤트
            $(document).on('click', '.tab-list .tab-item', function () {
                let currentIndex = $('.tab-list .tab-item.active').index();
                let newIndex = $(this).index();
                let moveDirection = newIndex > currentIndex ? 'move-next' : 'move-prev';

                $('.tab-item').removeClass('active');
                $(this).addClass('active');

                $('.tab-content').removeClass('active move-next move-prev');
                $('.tab-content').eq(newIndex).addClass('active ' + moveDirection);

                renderCurrentTab(newIndex);
            });

            // 전역 정렬 상태 (처음 접속 시 날짜 내림차순 정렬)
            let currentSortType = 'date'; // 'date', 'pay', or 'like'
            let currentSortDir = 'desc';
            const selectedHistoryById = {};

            window.openExploreHistoryDetail = function(historyId) {
                const key = String(historyId);
                const historyItem = selectedHistoryById[key];
                if (historyItem) {
                    try {
                        sessionStorage.setItem('explore_selected_history', JSON.stringify(historyItem));
                    } catch (e) {}
                }
                window.location.href = `./explore_detail.html?id=${encodeURIComponent(key)}`;
            };

            // ★ 정렬 토글 기능 (오름차순/내림차순 / 필터)
            $(document).on('click', '.sort-item', function () {
                let $this = $(this);
                const $parentRow = $this.closest('.sort-row');
                $parentRow.find('.sort-item').not(this).removeClass('active sort-up sort-down');

                let selectedType = $this.attr('data-type') || ($this.find('.lspace').text().trim() === '날짜' ? 'date' : 'pay');

                if (currentSortType === selectedType) {
                    if (selectedType !== 'like') {
                        currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
                    }
                } else {
                    currentSortType = selectedType;
                    currentSortDir = 'desc';
                }

                $this.addClass('active');

                if (selectedType !== 'like') {
                    if (currentSortDir === 'asc') {
                        $this.removeClass('sort-down').addClass('sort-up');
                    } else {
                        $this.removeClass('sort-up').addClass('sort-down');
                    }
                }

                const activeIndex = $('.tab-list .tab-item.active').index();
                renderCurrentTab(activeIndex);
            });

            // 데이터 불러오기 유틸리티
            function getCurrentUser() {
                if (window.AuthManager && window.AuthManager.getCurrentUser()) {
                    return window.AuthManager.getCurrentUser();
                }
                let userJson = sessionStorage.getItem("user");
                if (userJson) {
                    try { return JSON.parse(userJson); } catch(e) {}
                }
                return { id: '2', name: '최수아', email: 'capegon21@gmail.com' };
            }

            function getWorkerProfile(userName) {
                let profileStr = sessionStorage.getItem("kimp_worker_profile");
                if (profileStr) return JSON.parse(profileStr);
                return { workedHours: 22 };
            }

            function getCurrentUserShopHistory() {
                const user = getCurrentUser();
                const currentUserId = user && user.id !== undefined && user.id !== null ? String(user.id) : null;
                const state = window.FactoryStore ? window.FactoryStore.getState() : { shopHistory: [], utonShopHistory: [] };
                const shopHistory = window.FactoryStore && typeof window.FactoryStore.getShopOrders === 'function'
                    ? window.FactoryStore.getShopOrders()
                    : ([]
                        .concat(Array.isArray(state.shopHistory) ? state.shopHistory : [])
                        .concat(Array.isArray(state.utonShopHistory) ? state.utonShopHistory : []));

                return shopHistory.filter(item => {
                    if (!item) return false;
                    const hasOrderUserId = item.userId !== undefined &&
                        item.userId !== null &&
                        String(item.userId).trim() !== '';
                    if (!hasOrderUserId) return true;
                    if (currentUserId === null) return false;
                    return String(item.userId) === currentUserId;
                });
            }

            function isUtonMenuOrder(item) {
                const productId = String(item.productId || item.productCode || '').toLowerCase();
                const menuType = String(item.menuType || '').toLowerCase();
                return String(item.workId || '') === '2' ||
                    ['20001', '20002', 'p1', 'p2'].includes(productId) ||
                    ['udon', 'bibim'].includes(menuType);
            }

            function clearActiveShopOrderState(target, restoreOrderCount) {
                const activeProduct = sessionStorage.getItem('activeOrderProduct') || localStorage.getItem('activeOrderProduct_local');
                const activeNo = sessionStorage.getItem('activeOrderNo') || localStorage.getItem('activeOrderNo_local');
                const matchesActiveProduct = activeProduct !== null &&
                    target.productId !== undefined &&
                    target.productId !== null &&
                    String(activeProduct) === String(target.productId);
                const matchesActiveOrder = activeNo !== null &&
                    target.orderNo !== undefined &&
                    target.orderNo !== null &&
                    String(activeNo) === String(target.orderNo);

                if (!matchesActiveProduct && !matchesActiveOrder) return;

                try {
                    sessionStorage.removeItem('activeOrderProduct');
                    sessionStorage.removeItem('activeOrderNo');
                    sessionStorage.removeItem('activeOrderQty');
                    localStorage.removeItem('activeOrderProduct_local');
                    localStorage.removeItem('activeOrderNo_local');
                    localStorage.removeItem('activeOrderQty_local');
                    localStorage.removeItem('activeOrderNo_current');

                    if (!restoreOrderCount || !isUtonMenuOrder(target)) return;

                    const qty = Math.max(1, Number.parseInt(target.qty, 10) || 1);
                    let orderCount10Min = parseInt(sessionStorage.getItem('orderCount10Min') || '0', 10);
                    orderCount10Min = Math.max(0, orderCount10Min - qty);
                    sessionStorage.setItem('orderCount10Min', String(orderCount10Min));
                    if (orderCount10Min < 2) sessionStorage.removeItem('orderLimitExpireTime');

                    const productId = String(target.productId || target.productCode || '').toLowerCase();
                    const menuType = String(target.menuType || '').toLowerCase();
                    const isBibim = productId === '20002' || productId === 'p2' || menuType === 'bibim';
                    const counterKey = isBibim ? 'bibimOrderCount' : 'udonOrderCount';
                    let menuCount = parseInt(sessionStorage.getItem(counterKey) || '0', 10);
                    menuCount = Math.max(0, menuCount - qty);
                    sessionStorage.setItem(counterKey, String(menuCount));
                } catch (e) {}
            }

            window.cancelShopOrder = function(id) {
                if (!confirm("정말로 주문을 취소하시겠습니까?")) return;

                const target = getCurrentUserShopHistory().find(item => String(item.id) === String(id));
                if (!target || target.status !== 'pending') return;

                if (window.FactoryStore) {
                    window.FactoryStore.dispatch({ type: 'CANCEL_SHOP_ORDER', payload: target.id });
                }

                clearActiveShopOrderState(target, true);
                renderCurrentTab(3);
                alert("주문이 성공적으로 취소되었습니다.");
            };

            window.completeShopOrder = function(id) {
                const target = getCurrentUserShopHistory().find(item => String(item.id) === String(id));
                if (!target) return;

                const kitchenStatus = target.kitchenStatus || 'queued';
                if (target.status !== 'pending' || kitchenStatus !== 'ready') return;

                if (window.FactoryStore) {
                    window.FactoryStore.dispatch({ type: 'COMPLETE_SHOP_ORDER', payload: target.id });
                }

                clearActiveShopOrderState(target, false);
                renderCurrentTab(3);
                alert(`주문번호 #${target.orderNo || '-'} 수령 완료\n음식을 정상적으로 수령하였습니다. 맛있게 드세요!`);
            };

            // 렌더링 함수
            function renderCurrentTab(index) {
                const user = getCurrentUser();
                const userIdOrName = user.id || user.name || "2";

                if (index === 0) {
                    const worksList = [
                        { workId: 1, name: "김치만들기", brand: "AFood", icon: "./images/k-icon_150x150.png" },
                        { workId: 2, name: "우동만들기", brand: "Uton", icon: "./images/Uton_150x150.png" },
                        { workId: 3, name: "지갑만들기", brand: "Persa", icon: "./images/fancy_150x150.png" }
                    ];

                    let partnerHtml = '';
                    worksList.forEach(work => {
                        let hours = 0;
                        if (window.FactoryStore && typeof window.FactoryStore.getWorkHours === 'function') {
                            hours = window.FactoryStore.getWorkHours(userIdOrName, work.workId);
                        } else if (window.MockData && typeof window.MockData.getWorkHours === 'function') {
                            hours = window.MockData.getWorkHours(userIdOrName, work.workId);
                        }

                        let label = '일반';
                        let badgeClass = 'badge01';
                        if (hours >= 50) {
                            label = '매니저';
                            badgeClass = 'badge03';
                        } else if (hours >= 30) {
                            label = '헬퍼';
                            badgeClass = 'badge02';
                        }

                        partnerHtml += `
                            <div class="task-item" style="margin-bottom: 12px;">
                                <div class="task-items0">
                                    <div class="task-items">
                                        <img class="icon" src="${work.icon}" alt="icon"> 
                                        <div class="texts">
                                            <span>${work.name}</span> <span>${work.brand}</span>
                                        </div>
                                    </div>
                                    <div class="task-info-right">
                                        <span class="box-time">${Math.floor(hours)}h</span>
                                        <span class="${badgeClass}">${label}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    $('#partner-container').html(partnerHtml);
                } else if (index === 1) {
                    // FactoryStore가 app_reservations_db를 단일 원장으로 관리하므로 Store 목록만 사용합니다.
                    if (window.FactoryStore && typeof window.FactoryStore.markExpiredReservationsAbsent === 'function') {
                        window.FactoryStore.markExpiredReservationsAbsent(new Date());
                    }
                    const db = (window.FactoryStore && window.FactoryStore.getState)
                        ? (window.FactoryStore.getState().reservations || [])
                        : [];

                    const myReservations = db.filter(r =>
                        (String(r.userId) === String(user.id) || r.userName === user.name || String(r.userId) === String(user.name)) &&
                        !['early_left', 'completed', 'absent'].includes(String(r.workStatus || 'reserved'))
                    );

                    // 전역 정렬 상태 (currentSortType, currentSortDir) 반영
                    myReservations.sort((a, b) => {
                        if (currentSortType === 'pay') {
                            let minWage = 10320;
                            let payA = Math.floor(minWage * 2 * (a.ratio ? Number(a.ratio) : 1.2));
                            let payB = Math.floor(minWage * 2 * (b.ratio ? Number(b.ratio) : 1.2));
                            return currentSortDir === 'asc' ? (payA - payB) : (payB - payA);
                        } else {
                            let dateA = (a.date || '') + '_' + String(a.slot || 0);
                            let dateB = (b.date || '') + '_' + String(b.slot || 0);
                            let cmp = dateA.localeCompare(dateB);
                            return currentSortDir === 'asc' ? cmp : -cmp;
                        }
                    });

                    if (myReservations.length === 0) {
                        $('#reservation-container').html(`
                            <div class="empty-state">
                                <i class="bi bi-calendar-x empty-state-icon" style="font-size: 40px; margin-bottom:10px;"></i>
                                <div>예약된 일정이 없습니다.</div>
                            </div>
                        `);
                    } else {
                        const slotLabels = ['10:00 ~ 12:00', '13:00 ~ 15:00', '15:00 ~ 17:00'];
                        let html = '';
                        myReservations.forEach(r => {
                            const parts = r.date.split('-');
                            let dayName = '';
                            if (parts.length === 3) {
                                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                                const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
                                dayName = dayNames[d.getDay()];
                            }

                            const roleLabel = r.role === 'helper' ? '헬퍼' : (r.role === 'manager' ? '매니저' : '일반');
                            const badgeClass = r.role === 'helper' ? 'badge02' : (r.role === 'manager' ? 'badge03' : 'badge01');

                            const workId = r.workId || 1;
                            let workTitle = r.workName || "김치만들기";
                            let brandName = r.brandName || "AFood";
                            let iconUrl = r.iconUrl || "./images/k-icon_150x150.png";

                            try {
                                const worksList = JSON.parse(window.MockData.worksJSON);
                                const wObj = worksList.find(w => w.workId == workId);
                                if (wObj) {
                                    if (!r.workName) workTitle = wObj.workName;
                                    if (!r.brandName) brandName = wObj.brandName;
                                    if (!r.iconUrl) iconUrl = wObj.iconUrl;
                                }
                            } catch(e) {}

                            let minimumWage = 10320;
                            let ratioVal = r.ratio ? Number(r.ratio) : 1.2;
                            let expectedPay = Math.floor(minimumWage * 2 * ratioVal);
                            const displayRatio = ratioVal.toFixed(1);
                            
                            const displaySlotTime = r.time || (slotLabels[r.slot] || '지정 시간');
                            let workTimeLabel = "2h";
                            if (r.workId == 3) workTimeLabel = "3h";
                            else if (r.workId == 7) workTimeLabel = "2.5h";
                            else {
                                try {
                                    const slotData = window.MockData.getWorkTimeSlots(r.workId);
                                    if (slotData && slotData.type) workTimeLabel = slotData.type;
                                } catch(e) {}
                            }

                            html += `
                                <div class="task-item" style="margin-bottom: 12px; display: block;">
                                    <div class="task-items0" style="align-items: center;">
                                        <div class="task-items" style="flex: 1.2;">
                                            <img class="icon" src="${iconUrl}" alt="icon"> 
                                            <div class="texts">
                                                <span>${workTitle}</span>
                                                <span>${brandName}</span>
                                            </div>
                                        </div>
                                        <div class="task-info-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 0 5px;">
                                            <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 3px;">
                                                <span class="box-time">${workTimeLabel}</span>
                                                <span class="${badgeClass}">${roleLabel}</span>
                                            </div>
                                            <span style="font-size: 11px; color: #a29bfe;">${displaySlotTime}</span>
                                        </div>
                                        <div class="task-info-col" style="flex: 1.5; display: flex; flex-direction: row; align-items: center; justify-content: flex-end; gap: 18px;">
                                            <span class="task-info-ratio" style="color: #a29bfe; font-weight: bold; font-size: 14px; white-space: nowrap;">
                                                ${displayRatio}x
                                            </span>
                                            <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: center;">
                                                <span class="date-text" style="margin-bottom: 4px; font-size: 12px; color: #979797;">${parts[0]}.${parts[1]}.${parts[2]}</span>
                                                <span class="pay-text" style="color: #ccc; font-size:12px; white-space: nowrap;">예정 +₩ ${expectedPay.toLocaleString()}</span>  
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        $('#reservation-container').html(html);
                    }
                } else if (index === 2) {
                    function normalizeHistoryItem(item, itemIndex, userObj) {
                        const source = item || {};
                        const workId = window.MockData && typeof window.MockData.inferWorkId === 'function'
                            ? window.MockData.inferWorkId(source)
                            : (source.workId || (String(source.job || '').includes('우동') ? '2' : (String(source.job || '').includes('지갑') ? '3' : '1')));
                        const meta = window.MockData && typeof window.MockData.getWorkMeta === 'function'
                            ? window.MockData.getWorkMeta(workId)
                            : {};
                        const slotData = window.MockData && typeof window.MockData.getWorkTimeSlots === 'function'
                            ? window.MockData.getWorkTimeSlots(workId)
                            : null;
                        const fallbackTime = slotData && slotData.slots && slotData.slots[0]
                            ? slotData.slots[0].time
                            : '10:00 ~ 12:00';
                        const userId = userObj && (userObj.id || userObj.email || userObj.name) || 'guest';
                        const workTitle = window.MockData && typeof window.MockData.normalizeWorkTitle === 'function'
                            ? window.MockData.normalizeWorkTitle(source.job || source.workName || meta.title, workId)
                            : String(source.job || source.workName || meta.title || '김치만들기').replace(/^(Uton|AFood|Persa)\s+/i, '').trim();
                        const normalized = {
                            ...source,
                            workId: Number(workId),
                            job: workTitle,
                            workName: workTitle,
                            brandName: source.brandName || meta.brandName || 'AFood',
                            iconUrl: source.iconUrl || meta.iconUrl || './images/k-icon_150x150.png',
                            time: source.time || source.slotTime || fallbackTime,
                            status: source.status || '완료',
                            role: source.role || '일반',
                            pay: Number(source.pay) || 0
                        };
                        if (normalized.id === undefined || normalized.id === null || normalized.id === '') {
                            normalized.id = `hist-${userId}-${normalized.workId}-${String(normalized.date || itemIndex).replace(/\W/g, '')}-${itemIndex}`;
                        }
                        return normalized;
                    }

                    function getHistoryData(userObj) {
                        const userId = userObj ? userObj.id : "guest";
                        try {
                            const localHistory = localStorage.getItem("mypage_history_" + userId);
                            if (localHistory) {
                                const parsed = JSON.parse(localHistory);
                                if (Array.isArray(parsed) && parsed.length > 0) {
                                    return parsed.map((item, itemIndex) => normalizeHistoryItem(item, itemIndex, userObj));
                                }
                            }
                        } catch (e) { }

                        if (window.MockData && typeof window.MockData.getMockWorkHistories === 'function') {
                            return window.MockData.getMockWorkHistories(userObj).map((item, itemIndex) => normalizeHistoryItem(item, itemIndex, userObj));
                        }
                        return [normalizeHistoryItem({ date: '', job: '김치만들기', role: '일반', pay: 40000 }, 0, userObj)];
                    }

                    function parseDate(dateStr) {
                        if (!dateStr) return new Date(0);
                        if (dateStr.includes('년') && dateStr.includes('월')) {
                            const cleaned = dateStr.replace(/년|월|일/g, '').trim().split(/\s+/);
                            if (cleaned.length === 3) {
                                return new Date(parseInt(cleaned[0], 10), parseInt(cleaned[1], 10) - 1, parseInt(cleaned[2], 10));
                            }
                        }
                        const parts = dateStr.replace(/\./g, '-').split('-');
                        if (parts.length === 3) {
                            return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                        }
                        return new Date(dateStr);
                    }

                    function formatDisplayDate(dateStr) {
                        if (!dateStr) return '';
                        if (dateStr.includes('년') && dateStr.includes('월')) {
                            return dateStr.replace(/^\d+년\s*/, '');
                        }
                        const parts = dateStr.replace(/\./g, '-').split('-');
                        if (parts.length === 3) {
                            const month = parseInt(parts[1], 10);
                            const day = parseInt(parts[2], 10);
                            return `${month}월 ${day}일`;
                        }
                        return dateStr;
                    }

                    function formatRoleLabel(role) {
                        const normalized = String(role || '').toLowerCase();
                        if (normalized === 'general' || normalized === 'role_general') return '일반';
                        if (normalized === 'helper' || normalized === 'role_helper') return '헬퍼';
                        if (normalized === 'manager' || normalized === 'role_manager') return '매니저';
                        return role || '일반';
                    }

                    let historyData = getHistoryData(user);

                    historyData = [...historyData].sort((a, b) => {
                        let comparison = 0;
                        if (currentSortType === 'date') {
                            const dateA = parseDate(a.date);
                            const dateB = parseDate(b.date);
                            comparison = dateA - dateB;
                        } else if (currentSortType === 'pay') {
                            comparison = (a.pay || 0) - (b.pay || 0);
                        }

                        return currentSortDir === 'asc' ? comparison : -comparison;
                    });
                    let html = '';
                    Object.keys(selectedHistoryById).forEach(key => delete selectedHistoryById[key]);

                    historyData.forEach(h => {
                        selectedHistoryById[String(h.id)] = h;
                        const corpName = h.brandName || 'AFood';
                        const iconSrc = h.iconUrl || './images/k-icon_150x150.png';
                        const workTimeLabel = window.MockData && typeof window.MockData.getWorkDurationLabel === 'function'
                            ? window.MockData.getWorkDurationLabel(h.workId, 'type')
                            : '2h';

                        const roleLabel = formatRoleLabel(h.role);
                        let badgeClass = 'badge01';
                        if (roleLabel === '매니저') badgeClass = 'badge03';
                        else if (roleLabel === '헬퍼') badgeClass = 'badge02';

                        let rawTime = h.time || h.slot || '10:00 ~ 12:00';
                        let displayTime = rawTime;

                        if (rawTime.includes('~')) {
                            // '~' 기준으로 출근/퇴근 시간 분리
                            let parts = rawTime.split('~');

                            // 각 시간의 ':'를 기준으로 쪼갠 뒤 시(0), 분(1)까지만 합침
                            let start = parts[0].trim().split(':').slice(0, 2).join(':');
                            let end = parts[1].trim().split(':').slice(0, 2).join(':');

                            displayTime = `${start} ~ ${end}`;
                        } else if (rawTime.includes(':')) {
                            // 단일 시간만 있는 경우 방어 코드
                            displayTime = rawTime.split(':').slice(0, 2).join(':');
                        }
                        

                        const safeHistoryId = String(h.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                        html += `
                        <div class="task-item" style="margin-bottom: 12px; cursor: pointer;" onclick="window.openExploreHistoryDetail('${safeHistoryId}')">
                            <div class="task-items0" style="align-items: center;">
                                <div class="task-items" style="flex: 1.2;">
                                    <img class="icon" src="${iconSrc}" alt="icon"> 
                                    <div class="texts">
                                        <span>${h.job}</span>
                                        <span>${corpName}</span> 
                                    </div>
                                </div>
                                <div class="task-info-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 0 5px;">
                                    <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 3px;">
                                        <span class="box-time">${workTimeLabel}</span>
                                        <span class="${badgeClass}">${roleLabel}</span>
                                    </div>
                                    <span style="font-size: 11px; color: #a29bfe;">${displayTime}</span>
                                </div>
                                <div class="task-info-col" style="flex: 1.5; text-align: right; align-items: flex-end; display: flex; flex-direction: column;">
                                    <span class="date-text">${formatDisplayDate(h.date)}</span>
                                    <span class="pay-text">+₩ ${h.pay.toLocaleString()}</span>  
                                </div>
                            </div>
                        </div>`;
                    });

                    $('#history-container').html(html);
                } else if (index === 3) {
                    if (window.FactoryStore) {
                        window.FactoryStore.dispatch({ type: 'SYNC_FROM_STORAGE' });
                    }
                    const state = window.FactoryStore ? window.FactoryStore.getState() : { shopHistory: [], isLike: [] };
                    const container = $('#shopping-container');
                    container.empty();

                    // 정렬바 시각적 활성화 상태 동기화
                    const $sortRow = $('#tab-shopping .sort-row');
                    $sortRow.find('.sort-item').removeClass('active sort-up sort-down');
                    if (currentSortType === 'like') {
                        $sortRow.find('[data-type="like"]').addClass('active');
                    } else {
                        const $dateBtn = $sortRow.find('[data-type="date"]');
                        $dateBtn.addClass('active');
                        if (currentSortDir === 'asc') {
                            $dateBtn.addClass('sort-up');
                        } else {
                            $dateBtn.addClass('sort-down');
                        }
                    }

                    if (currentSortType === 'like') {
                        // 좋아요(관심상품) 필터 모드인 경우
                        const currentUserId = String(user.id);
                        const isLikeArr = state.isLike || [];
                        
                        // 현재 사용자의 관심 상품 레코드 필터링
                        const userLikes = isLikeArr.filter(r => String(r.userId) === String(currentUserId));

                        if (userLikes.length === 0) {
                            container.html(`
                                <div class="empty-state" style="padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 14px; background: rgba(0,0,0,0.2); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                                    <i class="bi bi-heart" style="font-size: 40px; margin-bottom: 6px; color: var(--text-sub); opacity: 0.7;"></i>
                                    <div style="font-weight: bold;">관심 상품으로 등록된 상품이 없습니다</div>
                                </div>
                            `);
                            return;
                        }

                        const storeProducts = (window.MockData && window.MockData.storeProducts) || [];

                        let html = '';
                        userLikes.forEach(record => {
                            const pId = Number(record.productId);
                            const product = storeProducts.find(p => Number(p.productId) === pId) || { name: "상품 " + pId, price: 3000, img: "./images/udon_product.png", brand: "Uton", workId: 2 };
                            
                            html += `
                            <div class="task-item" onclick="location.href='./kimp_detail.html?productId=${product.productId}&workId=${product.workId}'" style="margin-bottom: 12px; cursor: pointer; padding: 14px; background: rgba(0, 0, 0, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <img src="${product.img}" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover;" alt="product">
                                    <div style="text-align: left;">
                                        <div style="font-size: 11px; color: var(--text-sub);">${product.brand || 'Uton'}</div>
                                        <div style="font-size: 13px; font-weight: bold; color: var(--text-main);">${product.name}</div>
                                        <div style="font-size: 10px; color: #a29bfe; margin-top: 2px;">❤ 등록일: ${record.likedAt}</div>
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <span style="font-size: 13px; font-weight: bold; color: var(--text-main);">₩ ${product.price.toLocaleString()}</span>
                                    <span style="color: #ff3366; font-size: 18px;"><i class="bi bi-heart-fill"></i></span>
                                </div>
                            </div>`;
                        });
                        container.html(html);
                    } else {
                        // 날짜별 주문이력 모드인 경우
                        const shopHistory = getCurrentUserShopHistory();

                        if (shopHistory.length === 0) {
                            container.html(`
                                <div class="empty-state" style="padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 14px; background: rgba(0,0,0,0.2); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                                    <i class="bi bi-bag-x" style="font-size: 40px; margin-bottom: 6px; color: var(--text-sub); opacity: 0.7;"></i>
                                    <div style="font-weight: bold;">아직 주문한 내역이 없습니다</div>
                                </div>
                            `);
                            return;
                        }

                        // 날짜 오름차순/내림차순 정렬 적용
                        function parseShopDate(item) {
                            const dStr = item.orderDate || item.dateStr || '2026-01-01';
                            const tStr = item.orderTime || '00:00:00';
                            const cleanedD = dStr.replace(/\./g, '-').trim();
                            return new Date(cleanedD + 'T' + tStr);
                        }

                        let sortedHistory = [...shopHistory];
                        sortedHistory.sort((a, b) => {
                            const dateA = parseShopDate(a);
                            const dateB = parseShopDate(b);
                            return currentSortDir === 'asc' ? dateA - dateB : dateB - dateA;
                        });

                        let html = '';
                        sortedHistory.forEach(item => {
                            let statusTextHtml = "";
                            let btnHtml = "";
                            let inlineCancelButtonHtml = "";
                            let inlineReceiveButtonHtml = "";
                            let statusBadgeHtml = "";
                            const allowedKitchenStatuses = ['queued', 'preparing', 'ready'];
                            const kitchenStatus = allowedKitchenStatuses.includes(item.kitchenStatus)
                                ? item.kitchenStatus
                                : 'queued';
                            const amountHtml = item.shouldShowSpendAmount === false
                                ? `<div style="font-size: 13px; font-weight: 800; color: var(--text-sub); white-space: nowrap;">${item.paymentDisplayLabel || '주문취소됨'}</div>`
                                : `<div style="font-size: 15px; font-weight: 800; color: #ffffff; white-space: nowrap;">-₩ ${item.price.toLocaleString()}</div>`;

                            if (item.status === 'pending') {
                                statusTextHtml = `<div style="color: var(--text-main); font-weight: bold; font-size: 14px;">₩ ${item.price.toLocaleString()}</div>`;
                                if (kitchenStatus === 'ready') {
                                    statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">준비 완료</span>`;
                                    inlineReceiveButtonHtml = `
                                        <button type="button" class="res-check-in-btn" style="background: #10b981; color: #07130f; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer;" onclick="event.stopPropagation(); window.completeShopOrder('${item.id}')">수령하기</button>`;
                                } else {
                                    const isPreparing = kitchenStatus === 'preparing';
                                    statusBadgeHtml = isPreparing
                                        ? `<span style="margin-left: 2px; background: rgba(99, 102, 241, 0.16); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">조리 중</span>`
                                        : `<span style="margin-left: 2px; background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.35); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">조리 대기</span>`;
                                    inlineCancelButtonHtml = `
                                        <button type="button" class="res-cancel-btn" style="background: rgb(62 62 192); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 12px; border-radius: 12px; font-size: 11px; cursor: pointer;" onclick="event.stopPropagation(); window.cancelShopOrder('${item.id}')">주문 취소</button>`;
                                }
                            } else if (item.status === 'cancelled') {
                                statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(148, 163, 184, 0.12); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.24); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">주문 취소</span>`;
                                statusTextHtml = `<div style="color: var(--text-sub); font-size: 12px;">주문 취소</div>`;
                            } else if (item.status === 'completed') {
                                statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.16); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">수령 완료</span>`;
                                statusTextHtml = `<div style="color: var(--accent-pink); font-weight: bold; font-size: 14px;">-₩ ${item.price.toLocaleString()}</div>`;
                                btnHtml = ``;
                            } else {
                                statusBadgeHtml = `<span style="margin-left: 2px; background: rgba(148, 163, 184, 0.12); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.24); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px;">상태 확인 중</span>`;
                            }

                            // 상품 썸네일 이미지 및 브랜드 탐색
                            let pImg = './images/kimchi_300g.png';
                            let brandName = item.brandName || 'AFood';
                            const pIdStr = String(item.productId || '');
                            const pNameStr = item.productName || '';

                            if (window.MockData && window.MockData.storeProducts) {
                                const found = window.MockData.storeProducts.find(p => p.productCode === pIdStr || String(p.productId) === pIdStr || p.name === pNameStr);
                                if (found) {
                                    pImg = found.img || pImg;
                                    brandName = found.brand || brandName;
                                }
                            }
                            if (!pImg || pImg.includes('undefined')) {
                                if (pNameStr.includes('김치')) pImg = './images/kimchi_300g.png';
                                else if (pNameStr.includes('우동')) pImg = './images/udon_product.png';
                                else if (pNameStr.includes('비빔면')) pImg = './images/somyeon_complete.png';
                                else if (pNameStr.includes('지갑')) pImg = './images/wallet_card.png';
                            }

                            let isDelivery = true;
                            if (window.MockData && window.MockData.storeProducts) {
                                const found = window.MockData.storeProducts.find(p => p.productCode === pIdStr || String(p.productId) === pIdStr || p.name === pNameStr);
                                if (found && found.isDelivery !== undefined) {
                                    isDelivery = found.isDelivery;
                                }
                            }
                            if ((pNameStr.includes("우동") && !pNameStr.includes("수제")) || pNameStr.includes("비빔면")) {
                                isDelivery = false;
                            }

                            const qtyText = (item.qty || 1) + '개';
                            let deliveryBadgeHtml = isDelivery ? `<span style="background: rgba(0, 184, 148, 0.15); color: #00b894; border: 1px solid rgba(0, 184, 148, 0.3); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">배달 상품</span>` : '';
                            let topRightHtml = isDelivery ? 
                                `<div style="font-size: 11px; color: #cfcfcf; font-weight: 600; cursor: pointer;">배송조회 / 상세보기 <i class="bi bi-chevron-right"></i></div>` : 
                                `<div style="font-size: 11px; color: var(--text-sub);">주문번호: ${item.orderNo}번</div>`;

                            let clickAttr = isDelivery ? `onclick="window.location.href='delivery_detail.html?orderNo=${item.orderNo}&productId=${item.productId || ''}'"` : '';
                            let cursorStyle = isDelivery ? 'cursor: pointer;' : '';

                            html += `
                            <div class="task-item" ${clickAttr} style="${cursorStyle} margin-bottom: 12px; display: block; padding: 14px 16px; background: rgba(22, 24, 34, 0.75) !important; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08) !important; min-height: 105px; box-sizing: border-box;">
                                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 12px;">
                                    <div style="display: flex; align-items: center; font-size: 12px; color: var(--text-sub);">
                                        <span>${item.dateStr || item.orderDate} ${item.orderTime ? item.orderTime + ' ' : ''}주문</span>
                                        ${deliveryBadgeHtml}
                                        ${statusBadgeHtml}
                                    </div>
                                    ${topRightHtml}
                                </div>

                                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <img src="${pImg}" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid var(--card-border);" alt="${pNameStr}">
                                        <div style="text-align: left;">
                                            <div style="font-size: 11px; color: var(--accent-primary); font-weight: bold;">${brandName}</div>
                                            <div style="font-size: 14px; font-weight: bold; color: var(--text-main); margin-top: 3px;">${pNameStr} (${qtyText})</div>
                                        </div>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                                        ${inlineCancelButtonHtml}
                                        ${inlineReceiveButtonHtml}
                                        ${amountHtml}
                                    </div>
                                </div>
                                ${btnHtml}
                            </div>`;
                        });
                        container.html(html);
                    }
                }
            }

            // 초기 로딩 렌더링
            renderCurrentTab(targetIndex);
        });
    </script>
</body>

</html>
