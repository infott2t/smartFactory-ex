<script>
    document.addEventListener("DOMContentLoaded", function() {
        const works = (window.FactoryStore && typeof window.FactoryStore.getWorks === "function")
            ? window.FactoryStore.getWorks()
            : ((window.MockData && window.MockData.worksJSON) ? JSON.parse(window.MockData.worksJSON) : []);

        if (works.length > 0) {
            
            // 1. 오늘의 새로운 일 (isNew === true)
            const newWorksContainer = document.getElementById("new-works-container");
            const newWorks = works.filter(w => w.isNew).slice(0, 3);
            // 만약 새로운 일이 없으면 전체에서 몇 개 가져오기
            const displayNewWorks = newWorks.length > 0 ? newWorks : works.slice(0, 3);
            
            // 가중치는 렌더 직후 RatioFeed 가 현재 시각 기준으로 덮어쓴다.
            // (RatioFeed 가 없으면 worksJSON 의 salary 가 그대로 남는다)
            let newHtml = "";
            displayNewWorks.forEach(work => {
                newHtml += `
                <a class="box" href="./work_detail.html?id=${work.workId}">
                    <div class="up"><img src="${work.iconUrl}" /><div class="texts"><span>${work.workName}</span><span>${work.brandName}</span></div></div>
                    <div class="down"><div><span><i class="bi bi-caret-up-fill work-ratio-arrow" data-work-id="${work.workId}"></i></span><span class="val work-ratio" data-work-id="${work.workId}">${work.salary}</span></div>
                    <div><span class="val">${work.taskCount}</span><span>Task</span></div>
                    </div>
                </a>
                `;
            });
            if (newWorksContainer) newWorksContainer.innerHTML = newHtml;

            // 2. 지금 인기 있는 일 (isNew === false 인 것 중 앞의 3개)
            const popWorksContainer = document.getElementById("popular-works-container");
            const popWorks = works.filter(w => !w.isNew).slice(0, 3);
            const displayPopWorks = popWorks.length > 0 ? popWorks : works.slice(0, 3);
            
            let popHtml = "";
            displayPopWorks.forEach(work => {
                popHtml += `
                <a class="box" href="./work_detail.html?id=${work.workId}">
                    <div class="up"><img src="${work.iconUrl}" /><div class="texts"><span>${work.workName}</span><span>${work.brandName}</span></div></div>
                    <div class="down"><div><span><i class="bi bi-caret-up-fill work-ratio-arrow" data-work-id="${work.workId}"></i></span><span class="val work-ratio" data-work-id="${work.workId}">${work.salary}</span></div>
                    <div><span class="val">${work.taskCount}</span><span>Task</span></div>
                    </div>
                </a>
                `;
            });
            if (popWorksContainer) popWorksContainer.innerHTML = popHtml;
        }

        // 카드마다 자기 workId 의 가중치를 10초 단위로 갱신한다.
        // 계산과 DOM 갱신은 공용 모듈(js/ratio-feed.js)이 담당하므로
        // explore.html / work_detail.html 과 항상 같은 숫자가 나온다.
        if (window.RatioFeed) window.RatioFeed.startListFeed();
    });
</script>

<script type="text/javascript">
/* 인기 카테고리 순위 렌더링
 * - 태그별 참가자 합과 시급 배율(실시간 RatioFeed 값)로 점수를 계산해 정렬한다.
 * - 배율이 10초 버킷마다 바뀌므로 RatioFeed.onRefresh 로 순위도 함께 갱신한다. */
(function () {
    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function resolveRatio(workId, baseRatio) {
        if (window.RatioFeed && typeof window.RatioFeed.listValue === 'function') {
            var v = Number(window.RatioFeed.listValue(workId));
            if (isFinite(v) && v > 0) return v;
        }
        return baseRatio;
    }

    /** 직전 10초 구간의 배율 (등락 판정용) */
    function resolvePrevRatio(workId, baseRatio) {
        if (window.RatioFeed && typeof window.RatioFeed.listValue === 'function') {
            var stepMs = (window.RatioFeed.STEPS && window.RatioFeed.STEPS[window.RatioFeed.LIST_KEY])
                ? window.RatioFeed.STEPS[window.RatioFeed.LIST_KEY].stepMs
                : 10000;
            var v = Number(window.RatioFeed.listValue(workId, Date.now() - stepMs));
            if (isFinite(v) && v > 0) return v;
        }
        return baseRatio;
    }

    function renderCategoryRanking() {
        var box = document.getElementById('category-rank-list');
        if (!box) return;
        if (!window.MockData || typeof window.MockData.getCategoryRankings !== 'function') return;

        var rows = window.MockData.getCategoryRankings({ limit: 4, ratioResolver: resolveRatio });
        if (!rows.length) {
            box.innerHTML = '<div class="t-com"><div class="left"><span>표시할 카테고리가 없습니다.</span></div></div>';
            return;
        }

        // 직전 구간 배율로 같은 집계를 만들어 카테고리별 등락을 판정한다.
        var prevRatio = {};
        window.MockData.getCategoryRankings({ limit: 99, ratioResolver: resolvePrevRatio })
            .forEach(function (row) { prevRatio[row.label] = row.ratio; });

        box.innerHTML = rows.map(function (row) {
            var before = prevRatio[row.label];
            var diff = (typeof before === 'number') ? (row.ratio - before) : 0;
            var isUp = diff >= 0;
            var arrowClass = isUp ? 'bi-caret-up-fill status-up' : 'bi-caret-down-fill status-down';
            var pct = before ? (diff / before) * 100 : 0;
            var title = '참가자 ' + row.participants.toLocaleString() + '명 · 일 ' + row.workCount
                + '개 · 점수 ' + row.score.toLocaleString()
                + ' · 직전 대비 ' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
            return '<div class="t-com" title="' + escapeHtml(title) + '">'
                + '<div class="left"><span class="num">' + row.rank + '</span>'
                + '<span>' + escapeHtml(row.label) + '</span></div>'
                + '<div class="right">'
                + '<div class="u"><i class="bi ' + arrowClass + '"></i><span>' + row.ratio.toFixed(2) + '</span></div>'
                + '<div class="d"><i class="bi bi-caret-up-fill"></i><span>' + row.participants.toLocaleString() + '</span></div>'
                + '</div></div>';
        }).join('');
    }

    window.renderCategoryRanking = renderCategoryRanking;

    document.addEventListener('DOMContentLoaded', function () {
        renderCategoryRanking();
        if (window.RatioFeed && typeof window.RatioFeed.onRefresh === 'function') {
            window.RatioFeed.onRefresh(renderCategoryRanking);
        }
        // 참여 확정으로 참가자 수가 바뀌면 순위도 다시 계산한다.
        window.addEventListener('app:work-participants-changed', renderCategoryRanking);
    });
})();
</script>

<script type="text/javascript">
function resetSession() {
    if (confirm("세션을 초기화하시겠습니까? 로그인 정보 및 진행 데이터가 모두 삭제됩니다.")) {
        const userId = (window.AuthManager ? window.AuthManager.getUserId() : null) || sessionStorage.getItem("user-id") || "guest";
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (key.includes("_" + userId) || key.startsWith("kimp_"))) {
                keysToRemove.push(key);
            }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        
        if (typeof window.addAppLog === 'function') {
            window.addAppLog("세션을 초기화(로그아웃) 하였습니다.");
        }
        
        sessionStorage.clear();
        alert("세션이 초기화되었습니다. 페이지를 새로고침합니다.");
        window.location.reload();
    }
}

function resolveMainCurrentUser() {
    let sessionUser = null;

    if (window.AuthManager && typeof window.AuthManager.getCurrentUser === "function") {
        sessionUser = window.AuthManager.getCurrentUser();
    }

    if (!sessionUser) {
        try {
            sessionUser = JSON.parse(sessionStorage.getItem("user") || "null");
        } catch (error) {
            sessionUser = null;
        }
    }

    if (!sessionUser) {
        try {
            const userInfo = JSON.parse(sessionStorage.getItem("user_info") || "null");
            sessionUser = userInfo && (userInfo.user || userInfo);
        } catch (error) {
            sessionUser = null;
        }
    }

    const sessionId = sessionStorage.getItem("user-id");
    const needsDirectoryLookup = !sessionUser || !sessionUser.name;
    if (needsDirectoryLookup && sessionId && sessionId !== "guest") {
        let users = [];
        if (window.FactoryStore && typeof window.FactoryStore.getUsers === "function") {
            users = window.FactoryStore.getUsers();
        } else if (window.MockData && Array.isArray(window.MockData.users)) {
            users = window.MockData.users;
        }

        const normalizedId = String(sessionId).replace(/^local-/, "");
        const matchedUser = users.find(function(candidate) {
            return String(candidate.id) === String(sessionId)
                || String(candidate.email || "") === String(sessionId)
                || String(candidate.email || "") === normalizedId;
        });
        if (matchedUser) sessionUser = Object.assign({}, matchedUser, sessionUser || {});
    }

    return sessionUser;
}

function renderMainMemberControl() {
    const user = resolveMainCurrentUser();
    const button = $(".main-member-control .h-open-btn");
    if (!user || button.length === 0) return user;

    button.empty();
    if (user.picture) {
        const image = document.createElement("img");
        image.src = user.picture;
        image.alt = (user.name || "회원") + " 프로필";
        Object.assign(image.style, {
            width: "32px",
            height: "32px",
            borderRadius: "50%",
            border: "2px solid #ffffff",
            objectFit: "cover",
            verticalAlign: "middle"
        });
        button[0].appendChild(image);
    } else {
        const nameBadge = document.createElement("span");
        nameBadge.className = "badge-name";
        nameBadge.textContent = user.name || "회원";
        button[0].appendChild(nameBadge);
    }
    return user;
}

$(document).ready(function(){
    renderMainMemberControl();

    function checkLoginAndRedirect(targetUrl) {
        const user = resolveMainCurrentUser();
        if (!user) {
            alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
            window.location.href = "./login.html";
            return false;
        }
        if (targetUrl) {
            window.location.href = targetUrl;
        }
        return true;
    }

    $(".box").click(function(e){
        e.preventDefault();
        e.stopPropagation();
        var targetHref = $(this).attr("href");
        if (targetHref && (targetHref.indexOf("kimp.html") !== -1 || targetHref.indexOf("work_detail.html") !== -1)) {
            checkLoginAndRedirect(targetHref);
        }
    });

    $(".comment a").click(function(e){
         
    });

    $(".t-com").click(function(e){
        e.preventDefault();
        e.stopPropagation();
    });
    
    // 프로필 버튼 클릭 시 마이페이지(로그인 상태) 또는 로그인 페이지로 전환
    $(".h-open-btn").click(function(e) {
        e.stopPropagation();
        const isLoggedIn = !!resolveMainCurrentUser();
        if (isLoggedIn) {
            location.href = "./mypage2.html";
        } else {
            location.href = "./login.html";
        }
    });
});
</script>
