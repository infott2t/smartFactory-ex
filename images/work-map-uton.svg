<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Uton Shop 실내 지도</title>
  <desc id="map-desc">Uton Shop, 탈의실, 휴식공간, 화장실, QR 입력기, 입구, 사무실 위치 안내</desc>
  <rect width="400" height="280" rx="8" fill="#1a1a35"/>
  <rect x="10" y="10" width="380" height="260" rx="8" fill="none" stroke="#2d2d5e" stroke-width="2"/>

  <rect x="20" y="20" width="200" height="140" rx="4" fill="#1e1e3f" stroke="#3d3d7e"/>
  <text x="120" y="95" text-anchor="middle" fill="#76769e" font-size="12" font-family="Inter, Noto Sans KR, sans-serif">🍜 Uton Shop</text>

  <rect x="230" y="20" width="80" height="60" rx="4" fill="#2a1f4e" stroke="#6c5ce7"/>
  <text x="270" y="50" text-anchor="middle" fill="#a29bfe" font-size="10" font-family="Inter, Noto Sans KR, sans-serif">👔 탈의실</text>
  <text x="270" y="65" text-anchor="middle" fill="#76769e" font-size="8" font-family="Inter, Noto Sans KR, sans-serif">사물함 보관</text>

  <rect x="230" y="100" width="155" height="70" rx="6" fill="rgba(255,165,0,0.15)" stroke="#ff9f43" stroke-width="2" stroke-dasharray="4 2">
    <animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="307" y="130" text-anchor="middle" fill="#ff9f43" font-size="13" font-weight="700" font-family="Inter, Noto Sans KR, sans-serif">☕ 휴식공간 (Break Room)</text>
  <text x="307" y="148" text-anchor="middle" fill="#ffcc80" font-size="9" font-family="Inter, Noto Sans KR, sans-serif">음료수 · 간식 · 소파 · 충전기</text>

  <rect x="20" y="180" width="100" height="80" rx="6" fill="rgba(0,206,209,0.12)" stroke="#00cec9" stroke-width="2" stroke-dasharray="4 2">
    <animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="215" text-anchor="middle" fill="#00cec9" font-size="13" font-weight="700" font-family="Inter, Noto Sans KR, sans-serif">🚻 화장실 (Restroom)</text>
  <text x="70" y="233" text-anchor="middle" fill="#81ecec" font-size="9" font-family="Inter, Noto Sans KR, sans-serif">남/여 구분 · 세면대</text>
  <text x="70" y="247" text-anchor="middle" fill="#76769e" font-size="8" font-family="Inter, Noto Sans KR, sans-serif">이용 후 손씻기 필수!</text>

  <rect x="140" y="200" width="80" height="50" rx="4" fill="#2a2a3e" stroke="#dfe6e9" stroke-width=".8"/>
  <text x="180" y="225" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="Inter, Noto Sans KR, sans-serif">📱 QR 입력기</text>
  <text x="180" y="240" text-anchor="middle" fill="#76769e" font-size="7" font-family="Inter, Noto Sans KR, sans-serif">(출근/퇴근)</text>

  <rect x="240" y="200" width="60" height="50" rx="4" fill="#2a2a3e" stroke="#dfe6e9" stroke-width=".8"/>
  <text x="270" y="225" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="Inter, Noto Sans KR, sans-serif">🚪 입구</text>

  <rect x="320" y="200" width="65" height="50" rx="4" fill="#2a2a3e" stroke="#dfe6e9" stroke-width=".8"/>
  <text x="352" y="225" text-anchor="middle" fill="#dfe6e9" font-size="9" font-family="Inter, Noto Sans KR, sans-serif">🏢 사무실</text>

  <circle cx="25" cy="270" r="4" fill="#ff9f43"/>
  <text x="35" y="273" fill="#ff9f43" font-size="8" font-family="Inter, Noto Sans KR, sans-serif">= 휴식장소</text>
  <circle cx="110" cy="270" r="4" fill="#00cec9"/>
  <text x="120" y="273" fill="#00cec9" font-size="8" font-family="Inter, Noto Sans KR, sans-serif">= 화장실</text>
  <circle cx="195" cy="270" r="4" fill="#7b92ff"/>
  <text x="205" y="273" fill="#7b92ff" font-size="8" font-family="Inter, Noto Sans KR, sans-serif">= 작업 구역</text>
</svg>
